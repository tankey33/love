<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf0ed"><title>电影帖 · Tankey × Monody</title><link rel="icon" href="love.png"><link rel="stylesheet" href="assets/css/japanese-theme.css?v=20260828d"><style>
 *{box-sizing:border-box}body{margin:0}a{text-decoration:none}.archive{max-width:1600px;margin:auto;padding:clamp(48px,8vw,110px) clamp(18px,4vw,58px) 90px}.mast{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.5fr);gap:60px;align-items:end;border-bottom:1px solid var(--jp-line);padding-bottom:50px}.mast h1{font-size:clamp(54px,10vw,142px);line-height:.82;letter-spacing:-.06em;margin:0}.mast h1 i{font-weight:400;color:var(--jp-deep)}.mast-copy{border-left:1px solid var(--jp-line);padding-left:26px;color:var(--jp-soft);font-size:14px;line-height:2}.mast-copy small{display:block;margin-top:28px;color:var(--jp-deep);letter-spacing:.18em}.live{padding:48px 0 56px;border-bottom:1px solid var(--jp-line)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.section-head h2{font-size:clamp(28px,4vw,52px);margin:0}.section-head span{color:var(--jp-soft);font-size:10px;letter-spacing:.16em}.live-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,1.5vw,24px)}.library{padding-top:52px}.tools{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.search{width:min(360px,48vw);height:42px;padding:0 4px;color:var(--jp-ink);outline:none}.count{font-size:11px;color:var(--jp-soft);letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(18px,2vw,32px) clamp(12px,1.5vw,24px)}.card{display:block;min-width:0}.cover{position:relative;aspect-ratio:2/3;background:linear-gradient(145deg,var(--jp-pale),#8fb6ad);overflow:hidden}.cover:before{content:attr(data-glyph);position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.78);font-family:var(--jp-serif);font-size:clamp(24px,4vw,60px);letter-spacing:.16em}.cover img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;filter:saturate(.75) brightness(1.04);transition:.5s}.card:hover img{transform:scale(1.02);filter:saturate(.95)}.douban-hover{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(14px,1.8vw,22px);color:#fff;background:linear-gradient(180deg,rgba(19,42,48,0) 18%,rgba(18,47,53,.32) 45%,rgba(14,41,48,.92) 100%);opacity:0;transform:translateY(8px);transition:opacity .28s ease,transform .35s ease;pointer-events:none}.card:hover .douban-hover,.card:focus-visible .douban-hover{opacity:1;transform:none}.douban-score{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.42)}.douban-score span{font-size:11px;letter-spacing:.08em}.douban-score strong{font-size:clamp(24px,2.4vw,34px);line-height:1;font-weight:560;letter-spacing:-.04em}.douban-hover p{margin:0;font-size:12px;line-height:1.65;color:rgba(255,255,255,.92);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}.rank{z-index:4}.rank{position:absolute;z-index:2;left:9px;top:9px;background:rgba(234,240,237,.9);padding:6px 8px;font:11px var(--jp-latin);color:var(--jp-ink)}.copy{padding:13px 0 5px;border-bottom:1px solid var(--jp-line)}.copy h3{font-size:15px;line-height:1.35;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy p{font:11px/1.7 var(--jp-serif);color:var(--jp-soft);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{display:block;margin:44px auto 0;padding:12px 28px;border:1px solid var(--jp-line);background:transparent;color:var(--jp-ink);font:12px var(--jp-serif);cursor:pointer}.status{padding:20px 0;color:var(--jp-soft);font-size:12px}.skeleton{animation:pulse 1.5s infinite alternate}@keyframes pulse{to{opacity:.45}}
 @media(max-width:1100px){.live-row,.grid{grid-template-columns:repeat(4,1fr)}.mast{grid-template-columns:1fr}.mast-copy{max-width:560px}}
 @media(hover:none){.card:active .douban-hover,.card:focus .douban-hover{opacity:1;transform:none}}
 @media(max-width:760px){.archive{padding:46px 14px 70px}.mast{gap:35px;padding-bottom:36px}.mast h1{font-size:64px}.live{padding:34px 0 42px}.live-row,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}.live-row .card:nth-child(n+7){display:none}.section-head{align-items:start}.tools{position:sticky;top:56px;z-index:20;background:rgba(234,240,237,.92);padding:10px 0}.search{width:62vw}.copy h3{font-size:13px}}
 </style></head><body class="site-page page-movie">
 <header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">Tankey × Monody</a><nav class="nav"><a href="index.html">首页</a><a href="photo.html">写真</a><a href="notes.html">手记</a><a href="movie.html" class="active">电影</a><a href="music.html">音乐</a></nav></div></header>
 <main class="archive"><section class="mast"><div><div class="eyebrow">Films · 私藏</div><h1>电影<i>帖</i></h1></div><div class="mast-copy">每一张海报，都是一次进入另一种人生的门。<small>共藏 <b id="heroCount">—</b> 部电影 · 点击海报前往豆瓣</small></div></section>
 <section class="live"><div class="section-head"><h2>豆瓣此刻热门</h2><span id="liveStatus">LIVE · CHINA</span></div><div id="liveGrid" class="live-row"></div></section>
 <section class="library"><div class="section-head"><h2>旧藏拾遗</h2><span>A QUIET ARCHIVE</span></div><div class="tools"><input id="search" class="search" type="search" placeholder="寻一部电影……" autocomplete="off"><span id="count" class="count"></span></div><div id="grid" class="grid"></div><button id="more" class="more">再看一些</button></section></main>
 <script>
 const TYPE="movie", MEDIA="movie", ARCHIVE="data/movies.json", FALLBACK="data/movie-trending.json", FEED="https://rss.applemarketingtools.com/api/v2/cn/movies/top-movies/20/movies.json";
 const PAGE=TYPE==='movie'?20:30;let all=[],shown=PAGE,query='';const cacheKey='love-artwork-v2-'+TYPE;let artCache={};try{artCache=JSON.parse(localStorage.getItem(cacheKey)||'{}')}catch(e){}
 const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
 const big=u=>u?u.replace(/\/\d+x\d+(bb)?\.(jpg|png)/i,'/600x600bb.$2').replace(/\/\d+x\d+(bb)?$/i,'/600x600bb'):u;
 function normalize(i,live=false){return TYPE==='movie'?{title:i.title||i.name,search:i.english||i.name||i.title,year:i.year||(i.releaseDate||'').slice(0,4),sub:i.director||i.artistName||i.english||i.year,url:i.storeUrl||i.doubanUrl||i.url,art:i.posterUrl||i.artworkUrl100||i.artworkUrl,rating:(typeof i.rating==='object'?i.rating?.value:i.rating)||'',summary:i.summary||i.description||i.card_subtitle||'暂无简介',live}:{title:i.title||i.name,sub:i.artist||i.artistName||i.genre,url:i.url||i.doubanUrl,art:i.posterUrl||i.artworkUrl100||i.artworkUrl,live}}
 function posterData(i,n){
   const title=String(i.title||'未名'),english=String(i.search||''),year=String(i.year||'FILM');
   const hue=n%3,colors=hue===0?['#dcebe6','#5f877f']:hue===1?['#e8efeb','#779b93']:['#d4e5df','#476e67'];
   const svg='<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><rect width="600" height="900" fill="'+colors[0]+'"/><circle cx="'+(hue===1?120:470)+'" cy="'+(hue===2?690:190)+'" r="'+(hue===0?150:210)+'" fill="'+colors[1]+'" opacity=".28"/><path d="M54 70H546M54 830H546" stroke="#27322f" stroke-opacity=".35"/><text x="54" y="112" fill="#5f877f" font-family="serif" font-size="18" letter-spacing="6">PRIVATE CINEMA · '+String(n+1).padStart(2,'0')+'</text><text x="300" y="420" text-anchor="middle" fill="#27322f" font-family="serif" font-size="'+(title.length>8?42:58)+'" letter-spacing="8">'+title.replace(/[&<>]/g,'')+'</text><text x="300" y="468" text-anchor="middle" fill="#5f6c68" font-family="serif" font-size="16" letter-spacing="3">'+english.replace(/[&<>]/g,'').slice(0,38)+'</text><text x="54" y="800" fill="#27322f" font-family="serif" font-size="20" letter-spacing="4">'+year+' · T × M FILM ARCHIVE</text></svg>';
   return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)
 }
 function card(raw,n,live=false){const i=normalize(raw,live),glyph=(i.title||'清').slice(0,2),href=i.url||'#',src=i.art?big(i.art):posterData(i,n),score=i.rating?Number(i.rating).toFixed(1):'暂无';return '<a class="card" href="'+esc(href)+'" '+(href==='#'?'':'target="_blank" rel="noopener noreferrer"')+' data-title="'+esc(i.title)+'" data-search="'+esc(i.search||i.title)+'"><div class="cover '+(!i.art?'needs-art':'')+'" data-glyph="'+esc(glyph)+'"><img src="'+esc(src)+'" alt="'+esc(i.title||'电影海报')+'" loading="eager" referrerpolicy="no-referrer" data-fallback="'+esc(posterData(i,n))+'" onerror="this.onerror=null;this.src=this.dataset.fallback">'+(live?'<span class="rank">'+String(n+1).padStart(2,'0')+'</span>':'')+'<div class="douban-hover"><div class="douban-score"><span>豆瓣综合评分</span><strong>'+esc(score)+'</strong></div><p>'+esc(i.summary)+'</p></div></div><div class="copy"><h3>'+esc(i.title||'未名')+'</h3><p>'+esc(i.sub||'静静收藏')+'</p></div></a>'}
 async function getJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
 async function loadLive(){const box=document.getElementById('liveGrid');box.innerHTML=Array(5).fill('<div class="cover skeleton"></div>').join('');try{const list=await getJSON(FALLBACK);box.innerHTML=list.slice(0,20).map((x,n)=>card(x,n,true)).join('');const stamp=list[0]?.syncedAt;document.getElementById('liveStatus').textContent=stamp?'豆瓣同步 · '+stamp:'豆瓣热门 · 馆藏快照'}catch(e){box.innerHTML='<p class="status">豆瓣热门暂时无法同步。</p>';document.getElementById('liveStatus').textContent='同步失败'}}
 function filtered(){const q=query.toLowerCase();return all.filter(x=>!q||Object.values(x).flat().join(' ').toLowerCase().includes(q))}
 function render(){const list=filtered();document.getElementById('count').textContent='共 '+list.length+' 则';const box=document.getElementById('grid');box.innerHTML=list.slice(0,shown).map((x,n)=>card(x,n)).join('');document.getElementById('more').style.display=list.length>shown?'block':'none';hydrate(box)}
 async function findArt(title){if(artCache[title])return artCache[title];try{const url='https://itunes.apple.com/search?term='+encodeURIComponent(title)+'&country='+(TYPE==='movie'?'US':'CN')+'&media='+MEDIA+'&entity='+(TYPE==='movie'?'movie':'song')+'&limit=1';const d=await getJSON(url);const x=d.results?.[0];const art=big(x?.artworkUrl100);if(art){artCache[title]={art,url:x.trackViewUrl||x.collectionViewUrl||''};localStorage.setItem(cacheKey,JSON.stringify(artCache));return artCache[title]}}catch(e){}return null}
 async function hydrate(root){const cards=[...root.querySelectorAll('.card .needs-art')].slice(0,18);let cursor=0;async function worker(){while(cursor<cards.length){const cover=cards[cursor++],a=cover.closest('.card'),title=a.dataset.title,res=await findArt(a.dataset.search||title);if(res?.art){cover.classList.remove('needs-art');cover.insertAdjacentHTML('afterbegin','<img src="'+esc(res.art)+'" alt="" loading="lazy" referrerpolicy="no-referrer">');if(res.url&&a.getAttribute('href')==='#'){a.href=res.url;a.target='_blank';a.rel='noopener noreferrer'}}}}await Promise.all([worker(),worker(),worker()])}
 Promise.all([getJSON(ARCHIVE),loadLive()]).then(([data])=>{all=data;document.getElementById('heroCount').textContent=data.length;render()}).catch(()=>{document.getElementById('grid').innerHTML='<p class="status">馆藏正在歇息，请稍后再来。</p>'});
 document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();shown=PAGE;render()});document.getElementById('more').addEventListener('click',()=>{shown+=PAGE;render()});
 </script></body></html>
