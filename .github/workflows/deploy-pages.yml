name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'blog/posts/**'
      - 'scripts/**'
      - '*.html'
      - 'demo/**'
      - 'data/**'
      - 'assets/**'
      - 'photo/**'
      - '.github/workflows/deploy-pages.yml'
      - 'CNAME'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate blog artifacts
        run: python3 scripts/generate_posts.py
      - name: Refresh media charts and artwork
        continue-on-error: true
        run: python3 scripts/generate_media.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
