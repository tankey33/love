<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf2ef">
  <title>内容管理 · Tankey × Monody</title>
  <style>
    :root{--bg:#edf2ef;--paper:#f8faf8;--ink:#183039;--soft:#758582;--line:rgba(24,48,57,.14);--accent:#d9697c;--deep:#527a72;--shadow:0 24px 70px rgba(34,56,58,.12)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#fff 0,transparent 34%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Serif SC",sans-serif;min-height:100vh}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:17px clamp(18px,4vw,58px);border-bottom:1px solid var(--line);background:rgba(237,242,239,.88);backdrop-filter:blur(22px)}.brand{font-size:11px;letter-spacing:.24em}.brand i{font-style:normal;color:var(--accent)}.who{font-size:12px;color:var(--soft)}main{width:min(1240px,calc(100% - 28px));margin:0 auto;padding:clamp(34px,6vw,76px) 0 90px}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:36px}.intro h1{margin:0;font:400 clamp(42px,7vw,90px)/.95 Georgia,"Songti SC",serif;letter-spacing:-.05em}.intro p{margin:0;max-width:440px;color:var(--soft);line-height:1.9;font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:22px}.tab,.button{border:1px solid var(--line);border-radius:999px;padding:10px 18px;background:rgba(255,255,255,.55);color:var(--ink);cursor:pointer;transition:.25s}.tab:hover,.button:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(34,56,58,.1)}.tab.active,.button.primary{background:var(--ink);color:white;border-color:var(--ink)}.panel{display:none}.panel.active{display:block}.card{background:rgba(248,250,248,.8);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}.toolbar h2{font:400 21px Georgia,"Songti SC",serif;margin:0}.upload{position:relative;overflow:hidden}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line)}.photo{background:var(--paper);padding:10px;min-width:0}.photo img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover;border-radius:12px;background:#dce5e0}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px 2px}.name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.danger{border:0;background:none;color:#a74758;cursor:pointer;padding:5px}.posts{background:var(--paper)}.post{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.post strong{display:block;font:400 16px Georgia,"Songti SC",serif}.post small{color:var(--soft)}.actions{display:flex;gap:8px}.empty{padding:54px 20px;text-align:center;color:var(--soft)}dialog{width:min(720px,calc(100% - 24px));border:1px solid var(--line);border-radius:22px;padding:0;background:var(--paper);color:var(--ink);box-shadow:0 30px 100px rgba(20,40,44,.3)}dialog::backdrop{background:rgba(17,34,38,.36);backdrop-filter:blur(6px)}form{padding:25px}.form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.form-head h2{margin:0;font:400 25px Georgia,"Songti SC",serif}.close{border:0;background:none;font-size:26px;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.wide{grid-column:1/-1}.field label{font-size:11px;color:var(--soft);letter-spacing:.1em}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:white;color:var(--ink);outline:none}.field textarea{min-height:270px;resize:vertical;line-height:1.7}.form-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.check{font-size:13px;color:var(--soft)}.toast{position:fixed;right:18px;bottom:18px;z-index:100;max-width:min(390px,calc(100% - 36px));padding:13px 17px;border-radius:12px;background:var(--ink);color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}.toast.error{background:#8c3948}
    @media(max-width:700px){.intro{display:block}.intro p{margin-top:18px}.who{display:none}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.post{padding:15px}.actions .button{padding:8px 10px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">TANKEY <i>♥</i> MONODY · ADMIN</div><div class="who" id="who">正在验证身份…</div></header>
  <main>
    <section class="intro"><h1>内容管理</h1><p>照片与文章会直接保存到网站仓库。发布后 GitHub Actions 会自动刷新照片墙和文章页面。</p></section>
    <nav class="tabs"><button class="tab active" data-panel="photos">照片</button><button class="tab" data-panel="articles">文章</button></nav>
    <section class="panel active" id="photos"><div class="card"><div class="toolbar"><h2>照片墙</h2><label class="button primary upload">上传照片<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label></div><div class="list" id="photoList"><div class="empty">正在读取照片…</div></div></div></section>
    <section class="panel" id="articles"><div class="card"><div class="toolbar"><h2>文章</h2><button class="button primary" id="newPost">写文章</button></div><div class="posts" id="postList"><div class="empty">正在读取文章…</div></div></div></section>
  </main>
  <dialog id="editor"><form id="postForm"><div class="form-head"><h2>编辑文章</h2><button class="close" type="button" id="closeEditor">×</button></div><div class="fields"><div class="field"><label>标题</label><input name="title" required></div><div class="field"><label>文章地址</label><input name="slug" required placeholder="my-story"></div><div class="field"><label>日期</label><input name="date" type="date" required></div><div class="field"><label>封面地址（可选）</label><input name="cover"></div><div class="field wide"><label>摘要</label><input name="summary" maxlength="300"></div><div class="field wide"><label>正文（Markdown）</label><textarea name="body" required></textarea></div></div><input name="originalPath" type="hidden"><div class="form-foot"><label class="check"><input name="pinned" type="checkbox"> 置顶文章</label><button class="button primary" type="submit">保存并发布</button></div></form></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const api=async(path,options={})=>{const r=await fetch(path,options),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'操作失败');return d};
    const toast=(message,error=false)=>{const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className='toast',4200)};
    const size=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';
    const blobFromCanvas=(canvas,quality)=>new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('照片压缩失败')),'image/jpeg',quality));
    async function compressPhoto(file){
      if(file.type==='image/gif'||file.size<=1050000)return file;
      const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
      let width=bitmap.width,height=bitmap.height;
      const maxSide=2560,initialScale=Math.min(1,maxSide/Math.max(width,height));
      width=Math.max(1,Math.round(width*initialScale));height=Math.max(1,Math.round(height*initialScale));
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false});
      const draw=()=>{canvas.width=width;canvas.height=height;ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(bitmap,0,0,width,height)};
      draw();
      let quality=.88,blob=await blobFromCanvas(canvas,quality);
      while(blob.size>1100000&&quality>.56){quality-=.07;blob=await blobFromCanvas(canvas,quality)}
      while(blob.size>1100000&&Math.max(width,height)>1280){
        const scale=Math.max(.72,Math.min(.92,Math.sqrt(1000000/blob.size)*.96));
        width=Math.max(1,Math.round(width*scale));height=Math.max(1,Math.round(height*scale));draw();quality=.82;blob=await blobFromCanvas(canvas,quality);
      }
      bitmap.close();
      const name=file.name.replace(/\.[^.]+$/, '')+'.jpg';
      return new File([blob],name,{type:'image/jpeg',lastModified:file.lastModified});
    }
    document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');$('#'+tab.dataset.panel).classList.add('active')});
    async function loadPhotos(){const list=await api('/api/photos');$('#photoList').innerHTML=list.length?list.map(p=>`<article class="photo"><img loading="lazy" src="https://raw.githubusercontent.com/tankey33/love/main/${encodeURI(p.path)}" alt=""><div class="meta"><span class="name" title="${esc(p.name)}">${esc(p.name)} · ${size(p.size)}</span><button class="danger" data-delete-photo="${esc(p.path)}">删除</button></div></article>`).join(''):'<div class="empty">还没有照片</div>'}
    async function loadPosts(){const list=await api('/api/posts');$('#postList').innerHTML=list.length?list.map(p=>`<article class="post"><div><strong>${esc(p.name.replace(/\.md$/i,''))}</strong><small>${esc(p.path)}</small></div><div class="actions"><button class="button" data-edit="${esc(p.path)}">编辑</button><button class="danger" data-delete-post="${esc(p.path)}">删除</button></div></article>`).join(''):'<div class="empty">还没有文章</div>'}
    $('#photoInput').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;try{toast(`正在压缩 ${files.length} 张照片…`);const compressed=[];for(let i=0;i<files.length;i++){compressed.push(await compressPhoto(files[i]));toast(`正在压缩照片 ${i+1} / ${files.length}…`)}const before=files.reduce((n,f)=>n+f.size,0),after=compressed.reduce((n,f)=>n+f.size,0),fd=new FormData();compressed.forEach(f=>fd.append('photos',f));toast(`压缩完成 ${size(before)} → ${size(after)}，正在上传…`);await api('/api/photos',{method:'POST',body:fd});toast('上传成功，网站正在自动更新');await loadPhotos()}catch(err){toast(err.message,true)}finally{e.target.value=''}};
    $('#photoList').onclick=async e=>{const path=e.target.dataset.deletePhoto;if(!path||!confirm(`确定删除 ${path.split('/').pop()}？`))return;try{await api('/api/photos',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({paths:[path]})});toast('照片已删除，网站正在更新');await loadPhotos()}catch(err){toast(err.message,true)}};
    $('#postList').onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.deletePost;if(edit){try{const d=await api('/api/post?path='+encodeURIComponent(edit));openEditor(d.content,edit)}catch(err){toast(err.message,true)}}if(del&&confirm(`确定删除 ${del.split('/').pop()}？`)){try{await api('/api/posts',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({paths:[del]})});toast('文章已删除，网站正在更新');await loadPosts()}catch(err){toast(err.message,true)}}};
    function openEditor(content='',path=''){const form=$('#postForm');form.reset();form.elements.date.value=new Date().toISOString().slice(0,10);form.elements.originalPath.value=path;if(content){const match=content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/),meta={};if(match){match[1].split('\n').forEach(line=>{const i=line.indexOf(':');if(i>0)meta[line.slice(0,i).trim()]=line.slice(i+1).trim()});form.elements.title.value=meta.title||'';form.elements.date.value=meta.date||form.elements.date.value;form.elements.summary.value=meta.summary||'';form.elements.cover.value=meta.cover||'';form.elements.pinned.checked=meta.pinned==='true';form.elements.body.value=match[2].trim()}form.elements.slug.value=path.split('/').pop().replace(/\.md$/,'');form.elements.slug.readOnly=true}else form.elements.slug.readOnly=false;$('#editor').showModal()}
    $('#newPost').onclick=()=>openEditor();$('#closeEditor').onclick=()=>$('#editor').close();
    $('#postForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f);data.pinned=f.has('pinned');try{toast('正在保存文章…');await api('/api/posts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});$('#editor').close();toast('文章已发布，网站正在自动更新');await loadPosts()}catch(err){toast(err.message,true)}};
    (async()=>{try{const status=await api('/api/status');$('#who').textContent=status.email;await Promise.all([loadPhotos(),loadPosts()])}catch(err){toast(err.message,true);$('#who').textContent='验证失败'}})();
  </script>
</body>
</html>
