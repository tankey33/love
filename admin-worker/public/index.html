<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf2ef">
  <title>内容管理 · Tankey × Monody</title>
  <style>
    :root{--bg:#edf2ef;--paper:#f8faf8;--ink:#183039;--soft:#758582;--line:rgba(24,48,57,.14);--accent:#d9697c;--deep:#527a72;--shadow:0 24px 70px rgba(34,56,58,.12)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#fff 0,transparent 34%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Serif SC",sans-serif;min-height:100vh}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:17px clamp(18px,4vw,58px);border-bottom:1px solid var(--line);background:rgba(237,242,239,.88);backdrop-filter:blur(22px)}.brand{font-size:11px;letter-spacing:.24em}.brand i{font-style:normal;color:var(--accent)}.who{font-size:12px;color:var(--soft)}main{width:min(1240px,calc(100% - 28px));margin:0 auto;padding:clamp(34px,6vw,76px) 0 90px}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:36px}.intro h1{margin:0;font:400 clamp(42px,7vw,90px)/.95 Georgia,"Songti SC",serif;letter-spacing:-.05em}.intro p{margin:0;max-width:440px;color:var(--soft);line-height:1.9;font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:22px}.tab,.button{border:1px solid var(--line);border-radius:999px;padding:10px 18px;background:rgba(255,255,255,.55);color:var(--ink);cursor:pointer;transition:.25s}.tab:hover,.button:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(34,56,58,.1)}.tab.active,.button.primary{background:var(--ink);color:white;border-color:var(--ink)}.panel{display:none}.panel.active{display:block}.card{background:rgba(248,250,248,.8);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}.toolbar h2{font:400 21px Georgia,"Songti SC",serif;margin:0}.upload{position:relative;overflow:hidden}.upload.busy{opacity:.62;cursor:wait;pointer-events:none}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line)}.photo{background:var(--paper);padding:10px;min-width:0}.photo img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover;border-radius:12px;background:#dce5e0}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px 2px}.name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.danger{border:0;background:none;color:#a74758;cursor:pointer;padding:5px}.posts{background:var(--paper)}.post{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.post strong{display:block;font:400 16px Georgia,"Songti SC",serif}.post small{color:var(--soft)}.actions{display:flex;gap:8px}.empty{padding:54px 20px;text-align:center;color:var(--soft)}dialog{width:min(720px,calc(100% - 24px));border:1px solid var(--line);border-radius:22px;padding:0;background:var(--paper);color:var(--ink);box-shadow:0 30px 100px rgba(20,40,44,.3)}dialog::backdrop{background:rgba(17,34,38,.36);backdrop-filter:blur(6px)}form{padding:25px}.form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.form-head h2{margin:0;font:400 25px Georgia,"Songti SC",serif}.close{border:0;background:none;font-size:26px;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.wide{grid-column:1/-1}.field label{font-size:11px;color:var(--soft);letter-spacing:.1em}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:white;color:var(--ink);outline:none}.field textarea{min-height:270px;resize:vertical;line-height:1.7}.form-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.check{font-size:13px;color:var(--soft)}.toast{position:fixed;right:18px;bottom:18px;z-index:100;max-width:min(390px,calc(100% - 36px));padding:13px 17px;border-radius:12px;background:var(--ink);color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}.toast.error{background:#8c3948}
    .upload-help{margin:0;padding:11px 20px 13px;border-bottom:1px solid var(--line);color:var(--soft);font-size:11px;line-height:1.65}.upload-help strong{color:var(--ink);font-weight:500}@media(max-width:700px){.intro{display:block}.intro p{margin-top:18px}.who{display:none}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.post{padding:15px}.actions .button{padding:8px 10px}.toolbar{align-items:flex-start}.upload-help{padding-inline:16px}}
    .upload-queue{position:fixed;right:16px;bottom:16px;z-index:120;width:min(370px,calc(100vw - 24px));max-height:min(62vh,520px);display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.7);border-radius:18px;background:rgba(245,250,248,.92);box-shadow:0 22px 70px rgba(22,47,52,.24);backdrop-filter:blur(24px) saturate(150%);overflow:hidden}.upload-queue.hidden{display:none}.upload-queue.minimized{width:230px}.upload-queue.minimized .upload-queue-list{display:none}.upload-queue-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}.upload-queue-title{min-width:0}.upload-queue-title strong{display:block;font-size:13px}.upload-queue-title span{display:block;margin-top:3px;color:var(--soft);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.upload-queue-toggle{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.68);cursor:pointer}.upload-queue-list{overflow:auto;padding:7px}.upload-task{padding:9px 8px;border-bottom:1px solid rgba(24,48,57,.08)}.upload-task:last-child{border-bottom:0}.upload-task-line{display:flex;justify-content:space-between;gap:10px;font-size:10px}.upload-task-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upload-task-status{flex:0 0 auto;color:var(--soft)}.upload-task[data-state="success"] .upload-task-status{color:#39775d}.upload-task[data-state="skipped"] .upload-task-status{color:#9b7432}.upload-task[data-state="failed"] .upload-task-status{color:#a74758}.upload-task-bar{height:3px;margin-top:7px;border-radius:4px;background:rgba(24,48,57,.1);overflow:hidden}.upload-task-bar i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6f9891,#d9697c);transition:width .3s ease}.upload-task[data-state="skipped"] .upload-task-bar i{background:#c59a4e}.upload-task[data-state="failed"] .upload-task-bar i{background:#a74758}@media(max-width:700px){.upload-queue{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:auto;max-height:48vh}.upload-queue.minimized{left:auto;width:min(230px,calc(100vw - 20px))}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">TANKEY <i>♥</i> MONODY · ADMIN</div><div class="who" id="who">正在验证身份…</div></header>
  <main>
    <section class="intro"><h1>内容管理</h1><p>照片与文章会直接保存到网站仓库。发布后 GitHub Actions 会自动刷新照片墙和文章页面。</p></section>
    <nav class="tabs"><button class="tab active" data-panel="photos">照片</button><button class="tab" data-panel="articles">文章</button></nav>
    <section class="panel active" id="photos"><div class="card"><div class="toolbar"><h2>照片墙</h2><label class="button primary upload">上传照片 / 实况<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,.heic,.heif,video/quicktime,video/mp4,.mov,.m4v" multiple></label></div><p class="upload-help"><strong>实况照片：</strong>请从“文件”中同时选择同名的 HEIC/JPG 与 MOV；只选择静态照片时，浏览器无法取得实况视频。</p><div class="list" id="photoList"><div class="empty">正在读取照片…</div></div></div></section>
    <section class="panel" id="articles"><div class="card"><div class="toolbar"><h2>文章</h2><button class="button primary" id="newPost">写文章</button></div><div class="posts" id="postList"><div class="empty">正在读取文章…</div></div></div></section>
  </main>
  <dialog id="editor"><form id="postForm"><div class="form-head"><h2>编辑文章</h2><button class="close" type="button" id="closeEditor">×</button></div><div class="fields"><div class="field"><label>标题</label><input name="title" required></div><div class="field"><label>文章地址</label><input name="slug" required placeholder="my-story"></div><div class="field"><label>日期</label><input name="date" type="date" required></div><div class="field"><label>封面地址（可选）</label><input name="cover"></div><div class="field wide"><label>摘要</label><input name="summary" maxlength="300"></div><div class="field wide"><label>正文（Markdown）</label><textarea name="body" required></textarea></div></div><input name="originalPath" type="hidden"><div class="form-foot"><label class="check"><input name="pinned" type="checkbox"> 置顶文章</label><button class="button primary" type="submit">保存并发布</button></div></form></dialog>
  <div class="toast" id="toast"></div>
  <section class="upload-queue hidden" id="uploadQueue" aria-live="polite"><div class="upload-queue-head"><div class="upload-queue-title"><strong>照片上传</strong><span id="uploadQueueSummary">准备中…</span></div><button class="upload-queue-toggle" id="uploadQueueToggle" type="button" aria-label="最小化上传进度">−</button></div><div class="upload-queue-list" id="uploadQueueList"></div></section>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script>
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const api=async(path,options={})=>{const r=await fetch(path,options),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`请求失败（HTTP ${r.status}）`);return d};
    const toast=(message,error=false)=>{const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className='toast',4200)};
    const size=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';
    const uploadState={total:0,success:0,skipped:0,failed:0};
    function initUploadQueue(files){Object.assign(uploadState,{total:files.length,success:0,skipped:0,failed:0});$('#uploadQueue').classList.remove('hidden','minimized');$('#uploadQueueToggle').textContent='−';$('#uploadQueueList').innerHTML=files.map((file,index)=>`<div class="upload-task" id="uploadTask${index}" data-state="waiting"><div class="upload-task-line"><span class="upload-task-name" title="${esc(file.name)}">${esc(file.name)}</span><span class="upload-task-status">等待处理</span></div><div class="upload-task-bar"><i></i></div></div>`).join('');updateUploadSummary()}
    function updateUploadTask(index,state,label,progress){const task=$(`#uploadTask${index}`);if(!task)return;task.dataset.state=state;task.querySelector('.upload-task-status').textContent=label;task.querySelector('.upload-task-bar i').style.width=Math.max(0,Math.min(100,progress))+'%'}
    function updateUploadSummary(){const done=uploadState.success+uploadState.skipped+uploadState.failed;$('#uploadQueueSummary').textContent=`${done}/${uploadState.total} · 成功 ${uploadState.success} · 跳过 ${uploadState.skipped}${uploadState.failed?' · 失败 '+uploadState.failed:''}`}
    $('#uploadQueueToggle').onclick=()=>{const queue=$('#uploadQueue'),minimized=queue.classList.toggle('minimized');$('#uploadQueueToggle').textContent=minimized?'+':'−';$('#uploadQueueToggle').setAttribute('aria-label',minimized?'展开上传进度':'最小化上传进度')};
    async function readExif(file){
      if(window.exifr){try{const raw=await window.exifr.parse(file,{gps:true});if(raw)return {takenAt:raw.DateTimeOriginal||raw.CreateDate||raw.ModifyDate,make:raw.Make,camera:raw.Model,lens:raw.LensModel||raw.Lens,aperture:raw.FNumber,shutterSeconds:raw.ExposureTime,iso:raw.ISO,focalLength:raw.FocalLength,focalLength35:raw.FocalLengthIn35mmFormat,exposureCompensation:raw.ExposureBiasValue,flash:raw.Flash,whiteBalance:raw.WhiteBalance,software:raw.Software,latitude:raw.latitude,longitude:raw.longitude,colorSpace:raw.ColorSpace,artist:raw.Artist,copyright:raw.Copyright,exposureProgram:raw.ExposureProgram,exposureMode:raw.ExposureMode,meteringMode:raw.MeteringMode,sceneCaptureType:raw.SceneCaptureType,contrast:raw.Contrast,saturation:raw.Saturation,sharpness:raw.Sharpness,brightnessValue:raw.BrightnessValue,subjectDistance:raw.SubjectDistance,digitalZoom:raw.DigitalZoomRatio,orientation:raw.Orientation,timeZone:raw.OffsetTimeOriginal}}catch(error){console.warn('完整 EXIF 读取失败，使用兼容模式',file.name,error)}}
      if(file.type!=='image/jpeg'&&!/\.jpe?g$/i.test(file.name))return {};
      try{
        const view=new DataView(await file.arrayBuffer());let offset=2;
        while(offset+10<view.byteLength){
          if(view.getUint8(offset)!==255){offset++;continue}
          const marker=view.getUint8(offset+1),length=view.getUint16(offset+2);
          if(marker===225&&view.getUint32(offset+4)===0x45786966){
            const base=offset+10,little=view.getUint16(base)===0x4949;
            const u16=o=>view.getUint16(base+o,little),u32=o=>view.getUint32(base+o,little);
            const text=(entry,count)=>{const start=count<=4?entry+8:base+u32(entry+8);let out='';for(let i=0;i<count-1&&start+i<view.byteLength;i++)out+=String.fromCharCode(view.getUint8(start+i));return out.trim()};
            const rational=entry=>{const start=base+u32(entry+8),n=view.getUint32(start,little),d=view.getUint32(start+4,little);return d?n/d:null};
            const dir=at=>{const found={};if(!at||base+at+2>view.byteLength)return found;const count=u16(at);for(let i=0;i<Math.min(count,256);i++){const e=at+2+i*12;if(base+e+12>view.byteLength)break;const tag=u16(e),type=u16(e+2),n=u32(e+4);found[tag]={e:base+e,type,n,value:type===2?text(base+e,n):type===3?view.getUint16(base+e+8,little):type===4?view.getUint32(base+e+8,little):type===5?rational(base+e):null}}return found};
            const root=dir(u32(4)),exif=dir(root[0x8769]?.value||0),value=(tag,...sets)=>sets.map(s=>s[tag]?.value).find(v=>v!==undefined&&v!==null&&v!=='');
            return {takenAt:value(0x9003,exif)||value(0x9004,exif)||value(0x0132,root),make:value(0x010f,root),camera:value(0x0110,root),lens:value(0xa434,exif),aperture:value(0x829d,exif),shutterSeconds:value(0x829a,exif),iso:value(0x8827,exif),focalLength:value(0x920a,exif),focalLength35:value(0xa405,exif),flash:value(0x9209,exif),whiteBalance:value(0xa403,exif),software:value(0x0131,root)};
          }
          if(marker===218||length<2)break;offset+=2+length;
        }
      }catch(error){console.warn('EXIF读取失败',file.name,error)}
      return {};
    }
    const blobFromCanvas=(canvas,quality)=>new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('照片压缩失败')),'image/jpeg',quality));
    async function compressPhoto(file){
      const isHeic=/\.(?:heic|heif)$/i.test(file.name)||/image\/hei[cf]/i.test(file.type);
      if(!file.type.startsWith('image/')&&!isHeic)return file;
      if(file.type==='image/gif')return file;
      let source=file;
      if(isHeic){
        if(typeof window.heic2any!=='function')throw Error('HEIC 转换组件未加载，请刷新页面后重试');
        let converted=await window.heic2any({blob:file,toType:'image/jpeg',quality:.92});
        if(Array.isArray(converted))converted=converted[0];
        source=new File([converted],file.name.replace(/\.[^.]+$/, '')+'.jpg',{type:'image/jpeg',lastModified:file.lastModified});
      }else if(file.size<=1050000)return file;
      const bitmap=await createImageBitmap(source,{imageOrientation:'from-image'});
      let width=bitmap.width,height=bitmap.height;
      const maxSide=2560,initialScale=Math.min(1,maxSide/Math.max(width,height));
      width=Math.max(1,Math.round(width*initialScale));height=Math.max(1,Math.round(height*initialScale));
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false});
      const draw=()=>{canvas.width=width;canvas.height=height;ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(bitmap,0,0,width,height)};
      draw();
      let quality=.88,blob=await blobFromCanvas(canvas,quality);
      while(blob.size>1100000&&quality>.56){quality-=.07;blob=await blobFromCanvas(canvas,quality)}
      while(blob.size>1100000&&Math.max(width,height)>1280){
        const scale=Math.max(.72,Math.min(.92,Math.sqrt(1000000/blob.size)*.96));
        width=Math.max(1,Math.round(width*scale));height=Math.max(1,Math.round(height*scale));draw();quality=.82;blob=await blobFromCanvas(canvas,quality);
      }
      bitmap.close();
      const name=source.name.replace(/\.[^.]+$/, '')+'.jpg';
      return new File([blob],name,{type:'image/jpeg',lastModified:file.lastModified});
    }
    document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');$('#'+tab.dataset.panel).classList.add('active')});
    let knownPhotoShas=new Set();
    async function loadPhotos(){const list=await api('/api/photos');knownPhotoShas=new Set(list.map(p=>p.sha).filter(Boolean));$('#photoList').innerHTML=list.length?list.map(p=>`<article class="photo"><img loading="lazy" src="https://raw.githubusercontent.com/tankey33/love/main/${encodeURI(p.path)}" alt=""><div class="meta"><span class="name" title="${esc(p.name)}">${esc(p.name)} · ${size(p.size)}</span><button class="danger" data-delete-photo="${esc(p.path)}">删除</button></div></article>`).join(''):'<div class="empty">还没有照片</div>'}
    async function loadPosts(){const list=await api('/api/posts');$('#postList').innerHTML=list.length?list.map(p=>`<article class="post"><div><strong>${esc(p.name.replace(/\.md$/i,''))}</strong><small>${esc(p.path)}</small></div><div class="actions"><button class="button" data-edit="${esc(p.path)}">编辑</button><button class="danger" data-delete-post="${esc(p.path)}">删除</button></div></article>`).join(''):'<div class="empty">还没有文章</div>'}
    const UPLOAD_BATCH_BYTES=1400*1024,UPLOAD_BATCH_FILES=1;
    const fileBase=file=>file.name.replace(/\.[^.]+$/,'').toLocaleLowerCase();
    const gitBlobSha=async file=>{const bytes=new Uint8Array(await file.arrayBuffer()),header=new TextEncoder().encode(`blob ${bytes.byteLength}\0`),payload=new Uint8Array(header.byteLength+bytes.byteLength);payload.set(header);payload.set(bytes,header.byteLength);return [...new Uint8Array(await crypto.subtle.digest('SHA-1',payload))].map(value=>value.toString(16).padStart(2,'0')).join('')};
    $('#photoInput').onchange=async e=>{
      const input=e.target,files=[...input.files];if(!files.length)return;
      const uploadControl=input.closest('.upload');
      let uploaded=0,processed=0,compressedBytes=0,skipped=0;
      const seenThisSelection=new Set();
      const originalBytes=files.reduce((sum,file)=>sum+file.size,0);
      initUploadQueue(files);
      input.disabled=true;uploadControl?.classList.add('busy');
      try{
        const groups=[],byBase=new Map();
        for(const [index,file] of files.entries()){
          const base=fileBase(file);let group=byBase.get(base);
          if(!group){group=[];byBase.set(base,group);groups.push(group)}
          group.push({file,index});
        }
        let batch=[],batchBytes=0;
        const flush=async()=>{
          if(!batch.length)return;
          const fd=new FormData();
          for(const item of batch)fd.append('photos',item.file);
          fd.append('metadata',JSON.stringify(batch.map(item=>item.meta)));
          batch.forEach(item=>updateUploadTask(item.index,'uploading','正在上传',78));
          toast(`正在分批上传 ${uploaded+1}–${uploaded+batch.length} / ${files.length}…`);
          let result;try{result=await api('/api/photos',{method:'POST',body:fd})}catch(error){batch.forEach(item=>{updateUploadTask(item.index,'failed','上传失败',100);uploadState.failed++});updateUploadSummary();throw error}
          const duplicates=new Set(result.duplicates||[]);skipped+=Number(result.skipped||0);
          batch.forEach(item=>{knownPhotoShas.add(item.sha);if(duplicates.has(item.file.name)){updateUploadTask(item.index,'skipped','重复，已跳过',100);uploadState.skipped++}else{updateUploadTask(item.index,'success','上传成功',100);uploadState.success++}});updateUploadSummary();
          uploaded+=Number(result.count??batch.length);batch=[];batchBytes=0;
          toast(`已安全上传 ${uploaded} / ${files.length}，继续处理中…`);
        };
        for(const group of groups){
          const prepared=[];
          for(const source of group){
            const original=source.file;
            updateUploadTask(source.index,'reading','读取照片信息',12);
            toast(`正在压缩 ${processed+1} / ${files.length} · 已上传 ${uploaded}…`);
            const meta={...await readExif(original),uploadedAt:new Date().toISOString(),originalName:original.name,originalSize:original.size,originalLastModified:original.lastModified||null};
            updateUploadTask(source.index,'compressing','正在压缩',34);
            const file=await compressPhoto(original);
            updateUploadTask(source.index,'checking','检查重复',58);
            prepared.push({file,meta,sha:await gitBlobSha(file),index:source.index});processed++;compressedBytes+=file.size;
          }
          if(prepared.every(item=>knownPhotoShas.has(item.sha)||seenThisSelection.has(item.sha))){skipped+=prepared.length;prepared.forEach(item=>{updateUploadTask(item.index,'skipped','重复，已跳过',100);uploadState.skipped++});updateUploadSummary();toast(`已跳过重复文件 ${skipped} 个 · 继续处理…`);continue}
          prepared.forEach(item=>seenThisSelection.add(item.sha));
          const groupBytes=prepared.reduce((sum,item)=>sum+item.file.size,0);
          if(batch.length&&(batchBytes+groupBytes>UPLOAD_BATCH_BYTES||batch.length+prepared.length>UPLOAD_BATCH_FILES))await flush();
          batch.push(...prepared);batchBytes+=groupBytes;
          if(batchBytes>=UPLOAD_BATCH_BYTES||batch.length>=UPLOAD_BATCH_FILES)await flush();
        }
        await flush();
        toast(`处理完成：上传 ${uploaded} 个，跳过重复 ${skipped} 个 · ${size(originalBytes)} → ${size(compressedBytes)}`);
        updateUploadSummary();
        await loadPhotos();
      }catch(err){
        const progress=uploaded?`（已完成 ${uploaded} / ${files.length}）`:'';
        toast(`${err.message}${progress}`,true);
        if(uploaded)await loadPhotos().catch(()=>{});
      }finally{
        input.disabled=false;uploadControl?.classList.remove('busy');input.value='';
      }
    };
    $('#photoList').onclick=async e=>{const path=e.target.dataset.deletePhoto;if(!path||!confirm(`确定删除 ${path.split('/').pop()}？`))return;try{await api('/api/photos',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({paths:[path]})});toast('照片已删除，网站正在更新');await loadPhotos()}catch(err){toast(err.message,true)}};
    $('#postList').onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.deletePost;if(edit){try{const d=await api('/api/post?path='+encodeURIComponent(edit));openEditor(d.content,edit)}catch(err){toast(err.message,true)}}if(del&&confirm(`确定删除 ${del.split('/').pop()}？`)){try{await api('/api/posts',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({paths:[del]})});toast('文章已删除，网站正在更新');await loadPosts()}catch(err){toast(err.message,true)}}};
    function openEditor(content='',path=''){const form=$('#postForm');form.reset();form.elements.date.value=new Date().toISOString().slice(0,10);form.elements.originalPath.value=path;if(content){const match=content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/),meta={};if(match){match[1].split('\n').forEach(line=>{const i=line.indexOf(':');if(i>0)meta[line.slice(0,i).trim()]=line.slice(i+1).trim()});form.elements.title.value=meta.title||'';form.elements.date.value=meta.date||form.elements.date.value;form.elements.summary.value=meta.summary||'';form.elements.cover.value=meta.cover||'';form.elements.pinned.checked=meta.pinned==='true';form.elements.body.value=match[2].trim()}form.elements.slug.value=path.split('/').pop().replace(/\.md$/,'');form.elements.slug.readOnly=true}else form.elements.slug.readOnly=false;$('#editor').showModal()}
    $('#newPost').onclick=()=>openEditor();$('#closeEditor').onclick=()=>$('#editor').close();
    $('#postForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f);data.pinned=f.has('pinned');try{toast('正在保存文章…');await api('/api/posts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});$('#editor').close();toast('文章已发布，网站正在自动更新');await loadPosts()}catch(err){toast(err.message,true)}};
    (async()=>{try{const status=await api('/api/status');$('#who').textContent=status.email;await Promise.all([loadPhotos(),loadPosts()])}catch(err){toast(err.message,true);$('#who').textContent='验证失败'}})();
  </script>
</body>
</html>
