<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410"><rect width="1100" height="410" rx="20" fill="#eff5f8"/><g font-family="Microsoft YaHei,sans-serif"><text x="45" y="65" fill="#17334b" font-size="30" font-weight="bold">程序回滚与业务数据分开保护</text><rect x="45" y="95" width="1010" height="60" rx="10" fill="white" stroke="#bdd0dc"/><text x="70" y="134" font-size="24" fill="#167569">1. 程序备份｜保留可回滚版本</text><rect x="45" y="170" width="1010" height="60" rx="10" fill="white" stroke="#bdd0dc"/><text x="70" y="209" font-size="24" fill="#167569">2. 兼容性检查｜用数据副本验证</text><rect x="45" y="245" width="1010" height="60" rx="10" fill="white" stroke="#bdd0dc"/><text x="70" y="284" font-size="24" fill="#167569">3. 确认回滚｜员工数据与配置保留</text><text x="45" y="370" font-size="20" fill="#536879">回滚程序不等于恢复旧数据库，避免覆盖后来填写的记录。</text></g></svg>