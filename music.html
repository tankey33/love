<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf0ed"><title>音乐帖 · Tankey × Monody</title><link rel="icon" href="love.png"><link rel="stylesheet" href="assets/css/japanese-theme.css"><style>
 *{box-sizing:border-box}body{margin:0}a{text-decoration:none}.archive{max-width:1600px;margin:auto;padding:clamp(48px,8vw,110px) clamp(18px,4vw,58px) 90px}.mast{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.5fr);gap:60px;align-items:end;border-bottom:1px solid var(--jp-line);padding-bottom:50px}.mast h1{font-size:clamp(54px,10vw,142px);line-height:.82;letter-spacing:-.06em;margin:0}.mast h1 i{font-weight:400;color:var(--jp-deep)}.mast-copy{border-left:1px solid var(--jp-line);padding-left:26px;color:var(--jp-soft);font-size:14px;line-height:2}.mast-copy small{display:block;margin-top:28px;color:var(--jp-deep);letter-spacing:.18em}.live{padding:48px 0 56px;border-bottom:1px solid var(--jp-line)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.section-head h2{font-size:clamp(28px,4vw,52px);margin:0}.section-head span{color:var(--jp-soft);font-size:10px;letter-spacing:.16em}.live-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,1.5vw,24px)}.library{padding-top:52px}.tools{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.search{width:min(360px,48vw);height:42px;padding:0 4px;color:var(--jp-ink);outline:none}.count{font-size:11px;color:var(--jp-soft);letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(18px,2vw,32px) clamp(12px,1.5vw,24px)}.card{display:block;min-width:0}.cover{position:relative;aspect-ratio:1/1;background:linear-gradient(145deg,var(--jp-pale),#8fb6ad);overflow:hidden}.cover:before{content:attr(data-glyph);position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.78);font-family:var(--jp-serif);font-size:clamp(24px,4vw,60px);letter-spacing:.16em}.cover img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;filter:saturate(.75) brightness(1.04);transition:.5s}.card:hover img{transform:scale(1.02);filter:saturate(.95)}.rank{position:absolute;z-index:2;left:9px;top:9px;background:rgba(234,240,237,.9);padding:6px 8px;font:11px var(--jp-latin);color:var(--jp-ink)}.copy{padding:13px 0 5px;border-bottom:1px solid var(--jp-line)}.copy h3{font-size:15px;line-height:1.35;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy p{font:11px/1.7 var(--jp-serif);color:var(--jp-soft);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{display:block;margin:44px auto 0;padding:12px 28px;border:1px solid var(--jp-line);background:transparent;color:var(--jp-ink);font:12px var(--jp-serif);cursor:pointer}.status{padding:20px 0;color:var(--jp-soft);font-size:12px}.skeleton{animation:pulse 1.5s infinite alternate}@keyframes pulse{to{opacity:.45}}
 @media(max-width:1100px){.live-row,.grid{grid-template-columns:repeat(4,1fr)}.mast{grid-template-columns:1fr}.mast-copy{max-width:560px}}
 @media(max-width:760px){.archive{padding:46px 14px 70px}.mast{gap:35px;padding-bottom:36px}.mast h1{font-size:64px}.live{padding:34px 0 42px}.live-row,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}.live-row .card:nth-child(n+7){display:none}.section-head{align-items:start}.tools{position:sticky;top:56px;z-index:20;background:rgba(234,240,237,.92);padding:10px 0}.search{width:62vw}.copy h3{font-size:13px}}
 </style></head><body class="site-page page-music">
 <header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">Tankey × Monody</a><nav class="nav"><a href="index.html">首页</a><a href="photo.html">写真</a><a href="notes.html">手记</a><a href="movie.html">电影</a><a href="music.html" class="active">音乐</a></nav></div></header>
 <main class="archive"><section class="mast"><div><div class="eyebrow">Music · 私藏</div><h1>音乐<i>帖</i></h1></div><div class="mast-copy">声音替时间保存温度。<br>曲终之后，余音仍在旧日里缓缓行走。<small>随榜单与馆藏，静静更新。</small></div></section>
 <section class="live"><div class="section-head"><h2>此刻流行</h2><span id="liveStatus">LIVE · CHINA</span></div><div id="liveGrid" class="live-row"></div></section>
 <section class="library"><div class="section-head"><h2>旧藏拾遗</h2><span>A QUIET ARCHIVE</span></div><div class="tools"><input id="search" class="search" type="search" placeholder="寻一部音乐……" autocomplete="off"><span id="count" class="count"></span></div><div id="grid" class="grid"></div><button id="more" class="more">再看一些</button></section></main>
 <script>
 const TYPE="music", MEDIA="music", ARCHIVE="data/music.json", FALLBACK="data/music-trending.json", FEED="https://rss.applemarketingtools.com/api/v2/cn/music/most-played/20/songs.json";
 const PAGE=TYPE==='movie'?20:30;let all=[],shown=PAGE,query='';const cacheKey='love-artwork-v2-'+TYPE;let artCache={};try{artCache=JSON.parse(localStorage.getItem(cacheKey)||'{}')}catch(e){}
 const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
 const big=u=>u?u.replace(/\/\d+x\d+(bb)?\.(jpg|png)/i,'/600x600bb.$2').replace(/\/\d+x\d+(bb)?$/i,'/600x600bb'):u;
 function normalize(i,live=false){return TYPE==='movie'?{title:i.title||i.name,sub:i.director||i.artistName||i.english||i.year,url:i.doubanUrl||i.url,art:i.posterUrl||i.artworkUrl100||i.artworkUrl,live}:{title:i.title||i.name,sub:i.artist||i.artistName||i.genre,url:i.url||i.doubanUrl,art:i.posterUrl||i.artworkUrl100||i.artworkUrl,live}}
 function card(raw,n,live=false){const i=normalize(raw,live),glyph=(i.title||'清').slice(0,2),href=i.url||'#';return '<a class="card" href="'+esc(href)+'" '+(href==='#'?'':'target="_blank" rel="noopener noreferrer"')+' data-title="'+esc(i.title)+'"><div class="cover '+(!i.art?'needs-art':'')+'" data-glyph="'+esc(glyph)+'">'+(i.art?'<img src="'+esc(big(i.art))+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+(live?'<span class="rank">'+String(n+1).padStart(2,'0')+'</span>':'')+'</div><div class="copy"><h3>'+esc(i.title||'未名')+'</h3><p>'+esc(i.sub||'静静收藏')+'</p></div></a>'}
 async function getJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
 async function loadLive(){const box=document.getElementById('liveGrid');box.innerHTML=Array(5).fill('<div class="cover skeleton"></div>').join('');try{const d=await getJSON(FEED);const list=d.feed?.results||[];box.innerHTML=list.slice(0,10).map((x,n)=>card(x,n,true)).join('');document.getElementById('liveStatus').textContent='LIVE · '+new Date().toLocaleDateString('zh-CN')}catch(e){const list=await getJSON(FALLBACK);box.innerHTML=list.map((x,n)=>card(x,n,true)).join('');document.getElementById('liveStatus').textContent='馆藏快照'}hydrate(box)}
 function filtered(){const q=query.toLowerCase();return all.filter(x=>!q||Object.values(x).flat().join(' ').toLowerCase().includes(q))}
 function render(){const list=filtered();document.getElementById('count').textContent='共 '+list.length+' 则';const box=document.getElementById('grid');box.innerHTML=list.slice(0,shown).map((x,n)=>card(x,n)).join('');document.getElementById('more').style.display=list.length>shown?'block':'none';hydrate(box)}
 async function findArt(title){if(artCache[title])return artCache[title];try{const url='https://itunes.apple.com/search?term='+encodeURIComponent(title)+'&country=CN&media='+MEDIA+'&limit=1';const d=await getJSON(url);const x=d.results?.[0];const art=big(x?.artworkUrl100);if(art){artCache[title]={art,url:x.trackViewUrl||x.collectionViewUrl||''};localStorage.setItem(cacheKey,JSON.stringify(artCache));return artCache[title]}}catch(e){}return null}
 async function hydrate(root){const cards=[...root.querySelectorAll('.card .needs-art')].slice(0,18);let cursor=0;async function worker(){while(cursor<cards.length){const cover=cards[cursor++],a=cover.closest('.card'),title=a.dataset.title,res=await findArt(title);if(res?.art){cover.classList.remove('needs-art');cover.insertAdjacentHTML('afterbegin','<img src="'+esc(res.art)+'" alt="" loading="lazy" referrerpolicy="no-referrer">');if(res.url&&a.getAttribute('href')==='#'){a.href=res.url;a.target='_blank';a.rel='noopener noreferrer'}}}}await Promise.all([worker(),worker(),worker()])}
 Promise.all([getJSON(ARCHIVE),loadLive()]).then(([data])=>{all=data;render()}).catch(()=>{document.getElementById('grid').innerHTML='<p class="status">馆藏正在歇息，请稍后再来。</p>'});
 document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();shown=PAGE;render()});document.getElementById('more').addEventListener('click',()=>{shown+=PAGE;render()});
 </script></body></html>
