    @media(max-width:640px){body.page-photo .viewer-panel{display:block!important;position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;max-height:42dvh!important;overflow-y:auto!important}.viewer-top{position:absolute!important;top:14px!important;right:14px!important;z-index:5}.viewer-copy{padding:4px 54px 0 4px!important}.viewer-kicker{padding-right:8px}.viewer-date{display:block!important;font-size:18px!important}.viewer-description{display:block!important;margin-top:7px!important}.exif{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px!important;margin-top:18px!important;padding-top:15px!important}.exif dd{font-size:11px!important;overflow-wrap:anywhere}.viewer-nav{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%!important;margin-top:16px!important}.viewer-nav button{width:100%;height:46px!important;padding:0 10px;border-radius:14px!important}.viewer-nav button span{display:inline!important}.viewer-close{width:38px!important;height:38px!important}.photo-summary{display:none}}

  <script>
  (async () => {
    try {
      const response = await fetch('assets/js/photo-data.js?_=' + Date.now(), {cache:'no-store'});
      if(!response.ok) throw new Error('照片索引加载失败');
      (0,eval)(await response.text());
    } catch(error) {
      console.error(error);
    }
    let source = Array.isArray(window.PHOTO_DATA) ? window.PHOTO_DATA : [];
    const grid = document.getElementById('grid'), empty = document.getElementById('empty');
    const viewer = document.getElementById('viewer'), stage = document.getElementById('stage'), viewerImage = document.getElementById('viewerImage'), viewerVideo = document.getElementById('viewerVideo');
    let items = [], current = 0, scale = 1, touchX = 0, lastGridWidth = 0, resizeFrame = 0, ignorePhotoClickUntil = 0;

    const shape = p => { const r=(p.width||1)/(p.height||1); return r>1.12?'landscape':r<.88?'portrait':'square' };
    const dateOf = p => new Date((p.takenAt || p.uploadedAt || p.date || p.mtime*1000) || Date.now());
    const dateText = p => new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(dateOf(p)).replaceAll('/','.');
    const safe = v => String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    function render(){
      items = source.slice().sort((a,b)=>dateOf(b)-dateOf(a));
      empty.classList.toggle('show',!items.length);
      const width=Math.max(320,grid.clientWidth||innerWidth),gap=innerWidth<640?3:4;
      const newestTarget=innerWidth<640?Math.max(190,innerHeight*.29):innerWidth<1000?Math.max(270,innerHeight*.36):Math.max(380,Math.min(520,innerHeight*.5));
      const oldestTarget=innerWidth<640?Math.max(108,innerHeight*.155):innerWidth<1000?Math.max(155,innerHeight*.2):Math.max(190,Math.min(260,innerHeight*.245));
      const targetAt=index=>{
        const progress=items.length<2?0:index/(items.length-1);
        const eased=1-Math.pow(1-progress,1.55);
        return newestTarget+(oldestTarget-newestTarget)*eased;
      };
      const rows=[];let row=[],ratioSum=0,targetSum=0;
      items.forEach((p,i)=>{
        const ratio=Math.max(.5,Math.min(2.4,(p.width||4)/(p.height||3)));
        const target=targetAt(i);
        row.push({p,i,ratio,target});ratioSum+=ratio;targetSum+=target;
        const rowTarget=targetSum/row.length;
        if(ratioSum*rowTarget+gap*(row.length-1)>=width){rows.push(row);row=[];ratioSum=0;targetSum=0}
      });
      if(row.length)rows.push(row);
      if(rows.length>1){
        const last=rows[rows.length-1],previous=rows[rows.length-2];
        const ratioOf=group=>group.reduce((total,item)=>total+item.ratio,0);
        const targetOf=group=>group.reduce((total,item)=>total+item.target,0)/group.length;
        while(previous.length>1&&(width-gap*(last.length-1))/ratioOf(last)>targetOf(last)*1.22)last.unshift(previous.pop());
      }
      grid.innerHTML=rows.map(group=>{
        const sum=group.reduce((n,x)=>n+x.ratio,0),ideal=(width-gap*(group.length-1))/sum;
        const height=ideal;
        const cards=group.map(({p,i,ratio})=>{
          const title=safe(p.title||p.file||('照片 '+(i+1))),kind=shape(p);
          const summary=[p.camera,p.lens,p.aperture,p.shutter,p.iso?('ISO '+p.iso):''].filter(Boolean).join(' · ')||(p.dateSource==='exif'?'保留原始拍摄信息':'原照片未包含 EXIF 信息');
          const live=p.isLivePhoto&&p.liveVideo?'<video class="tile-video" src="'+safe(p.liveVideo)+'" muted loop playsinline preload="metadata"></video><span class="live-badge"><b>◉</b> 实况</span>':'';
          return '<article class="photo-card tile-'+kind+'" style="flex:'+ratio+' 1 0" tabindex="0" role="button" aria-label="查看 '+title+'" data-index="'+i+'"><div class="photo-frame"><img src="'+safe(p.thumb||p.full)+'" data-original="'+safe(p.full)+'" alt="'+title+'" loading="'+(i<8?'eager':'lazy')+'" decoding="async" onload="this.classList.add(\'loaded\');this.closest(\'.photo-frame\').classList.add(\'ready\')">'+live+'<div class="photo-meta"><div><h2 class="photo-title">'+title+'</h2><p class="photo-date">'+dateText(p)+'</p><p class="photo-summary">'+safe(summary)+'</p></div></div></div></article>';
        }).join('');
        return '<div class="photo-row" style="height:'+height.toFixed(1)+'px">'+cards+'</div>';
      }).join('');
      lastGridWidth=grid.clientWidth;
    }

    const hasValue=value=>value!==undefined&&value!==null&&value!=='';
    function cleanMetadataValue(value,device=false){
      if(typeof value!=='string')return value;
      const text=value.normalize('NFKC').replace(/[\u0000-\u001f\u007f\ufffd]/g,'').replace(/\s+/g,' ').trim();
      if(!text||text.length>180)return '';
      if(device){
        const compact=[...text].filter(char=>!/\s/.test(char));
        const meaningful=compact.filter(char=>/[\p{L}\p{N}]/u.test(char)).length;
        if(text.length<2||!compact.length||meaningful/compact.length<.58)return '';
        if(/^\d{4}[:/-]\d{2}[:/-]\d{2}\s+\d{2}:\d{2}/.test(text))return '';
      }
      return text;
    }
    function cleanDeviceValue(value,field){
      const raw=cleanMetadataValue(value,true);if(!raw)return '';
      const ascii=[...raw].filter(char=>char.charCodeAt(0)<128).join('').trim();
      if(!ascii||ascii.length/raw.length<.78)return '';
      const text=ascii.replace(/\s+/g,' '),upper=text.toUpperCase();
      if(field==='make'){const brands=[['FUJIFILM','FUJIFILM'],['PANASONIC','Panasonic'],['OLYMPUS','OLYMPUS'],['RICOH','RICOH'],['NIKON','NIKON'],['CANON','Canon'],['SONY','SONY'],['APPLE','Apple'],['LEICA','LEICA'],['SAMSUNG','Samsung'],['GOOGLE','Google']];return brands.find(([token])=>upper.includes(token))?.[1]||''}
      if(field==='camera')return [/^iPhone\s+\w/i,/^ILCE-[A-Z0-9-]+$/i,/^(?:NEX|DSC)-[A-Z0-9-]+$/i,/^RICOH\s+GR\b/i,/^(?:Canon|NIKON|FUJIFILM|Panasonic|LEICA|OLYMPUS|Samsung|Google)\b/i].some(pattern=>pattern.test(text))?text:'';
      if(field==='lens')return text.length>=6&&/(?:\b\d+(?:\.\d+)?\s*mm\b|\bcamera\b|\blens\b|\b(?:FE|RF|EF|XF)\s)/i.test(text)?text:'';
      if(field==='software')return !/^\d{4}[:/-]\d{2}/.test(text)&&/(?:Adobe|Lightroom|Photoshop|Capture|Camera|ILCE|iOS|Android)|^\d+(?:\.\d+){1,3}$/i.test(text)?text:'';
      return text;
    }
    function renderDetails(p){
      const megapixels=p.width&&p.height?((p.width*p.height)/1000000).toFixed(2)+' MP':'';
      const fileSize=p.size?(p.size>1048576?(p.size/1048576).toFixed(2)+' MB':Math.round(p.size/1024)+' KB'):'';
      const rawMake=cleanMetadataValue(p.make,true);let make=cleanDeviceValue(rawMake,'make'),camera=cleanDeviceValue(p.camera,'camera');
      if(!camera&&/^RICOH\s+GR\b/i.test(rawMake))camera=[...rawMake].filter(char=>char.charCodeAt(0)<128).join('').trim();
      if(!camera&&/^(?:ILCE|NEX|DSC)-/i.test(rawMake)){camera=cleanDeviceValue(rawMake,'camera');make='SONY'}
      const sections=[
        ['基本信息',[['文件名',p.file],['文件大小',fileSize],['分辨率',p.width&&p.height?p.width+' × '+p.height:''],['像素',megapixels],['拍摄时间',p.takenAt||''],['日期来源',p.dateSource==='exif'?'照片 EXIF':'上传记录'],['色彩空间',p.colorSpace],['时区',p.timeZone],['作者',p.artist],['版权',p.copyright]]],
        ['拍摄参数',[['焦距',p.focalLength],['35mm 等效',p.focalLength35],['光圈',p.aperture],['曝光时间',p.shutter],['ISO',p.iso],['曝光补偿',p.exposureCompensation],['亮度',p.brightnessValue],['对焦距离',p.subjectDistance],['数码变焦',p.digitalZoom]]],
        ['设备信息',[['制造商',make],['相机',camera],['镜头',cleanDeviceValue(p.lens,'lens')],['软件',cleanDeviceValue(p.software,'software')],['方向',cleanMetadataValue(p.orientation)]]],
        ['拍摄模式',[['白平衡',p.whiteBalance],['曝光程序',p.exposureProgram],['曝光模式',p.exposureMode],['测光模式',p.meteringMode],['闪光灯',p.flash],['场景类型',p.sceneCaptureType],['对比度',p.contrast],['饱和度',p.saturation],['锐度',p.sharpness],['类型',p.isLivePhoto?'实况照片':'静态照片']]]
      ];
      document.getElementById('exif').innerHTML=sections.map(([title,rows])=>{const valid=rows.filter(row=>hasValue(row[1]));return valid.length?'<section class="viewer-data-section"><h3>'+title+'</h3>'+valid.map(row=>'<div class="viewer-data-row"><span>'+safe(row[0])+'</span><strong>'+safe(row[1])+'</strong></div>').join('')+'</section>':''}).join('');
      const map=document.getElementById('viewerMap');
      if(hasValue(p.latitude)&&hasValue(p.longitude)){const lat=Number(p.latitude),lon=Number(p.longitude);map.hidden=false;map.innerHTML='<h3>拍摄位置</h3><iframe loading="lazy" title="拍摄位置地图" src="https://www.openstreetmap.org/export/embed.html?marker='+encodeURIComponent(lat+','+lon)+'"></iframe><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+encodeURIComponent(lat)+'&mlon='+encodeURIComponent(lon)+'#map=15/'+encodeURIComponent(lat)+'/'+encodeURIComponent(lon)+'">'+safe(lat.toFixed(5)+', '+lon.toFixed(5))+'</a>'}else{map.hidden=true;map.innerHTML=''}
    }
    function renderFilmstrip(){
      const strip=document.getElementById('viewerFilmstrip'),radius=9,start=Math.max(0,current-radius),end=Math.min(items.length,current+radius+1);
      strip.innerHTML=items.slice(start,end).map((p,offset)=>{const index=start+offset;return '<button type="button" data-film-index="'+index+'" class="'+(index===current?'active':'')+'" aria-label="查看 '+safe(p.title||p.file)+'"><img src="'+safe(p.thumb||p.full)+'" alt="" loading="lazy"></button>'}).join('');
      requestAnimationFrame(()=>strip.querySelector('.active')?.scrollIntoView({block:'nearest',inline:'center'}));
    }
    function renderHistogram(image){
      const canvas=document.getElementById('viewerHistogram'),box=canvas.getBoundingClientRect();if(!image.naturalWidth||!box.width)return;
      const ratio=Math.min(2,devicePixelRatio||1),width=Math.max(240,Math.round(box.width*ratio)),height=Math.round(112*ratio);canvas.width=width;canvas.height=height;
      const sample=document.createElement('canvas'),sampleWidth=320,sampleHeight=Math.max(1,Math.round(image.naturalHeight*sampleWidth/image.naturalWidth));sample.width=sampleWidth;sample.height=sampleHeight;
      const sampleContext=sample.getContext('2d',{willReadFrequently:true});sampleContext.drawImage(image,0,0,sampleWidth,sampleHeight);
      const pixels=sampleContext.getImageData(0,0,sampleWidth,sampleHeight).data,bins=[new Array(64).fill(0),new Array(64).fill(0),new Array(64).fill(0)];
      for(let i=0;i<pixels.length;i+=4){bins[0][pixels[i]>>2]++;bins[1][pixels[i+1]>>2]++;bins[2][pixels[i+2]>>2]++}
      const context=canvas.getContext('2d'),max=Math.max(1,...bins.flat());context.clearRect(0,0,width,height);context.strokeStyle='rgba(255,255,255,.08)';for(let y=1;y<4;y++){context.beginPath();context.moveTo(0,height*y/4);context.lineTo(width,height*y/4);context.stroke()}
      ['#ff6b74','#67df91','#6ba7ff'].forEach((color,channel)=>{context.beginPath();bins[channel].forEach((value,index)=>{const x=index/(bins[channel].length-1)*width,y=height-value/max*(height-4);index?context.lineTo(x,y):context.moveTo(x,y)});context.strokeStyle=color;context.globalAlpha=.82;context.lineWidth=1.2*ratio;context.stroke()});context.globalAlpha=1;
    }

    function openAt(index){
      if(!items.length) return; current=(index+items.length)%items.length; const p=items[current]; scale=1;
      viewerImage.style.transform='scale(1)'; viewerImage.src=p.full; viewerImage.alt=p.title||p.file||'照片';
      stage.classList.remove('live-playing');viewerVideo.pause();viewerVideo.removeAttribute('src');viewerVideo.load();
      const liveBadge=document.getElementById('viewerLiveBadge');liveBadge.hidden=!(p.isLivePhoto&&p.liveVideo);
      if(p.isLivePhoto&&p.liveVideo){viewerVideo.src=p.liveVideo;document.getElementById('zoomHint').textContent=matchMedia('(hover:hover)').matches?'移入照片播放实况 · 双击缩放':'按住照片播放实况 · 双击缩放'}else document.getElementById('zoomHint').textContent='滚轮或双击缩放 · ESC 关闭';
      const title=String(p.title||'').trim(),titleElement=document.getElementById('viewerTitle');
      titleElement.hidden=!title||/^\d+$/.test(title);titleElement.textContent=titleElement.hidden?'':title;
      document.getElementById('viewerKicker').textContent=p.dateSource==='exif'?'Captured moment · 拍摄时间':'Archive moment · 上传时间';
      document.getElementById('viewerDate').textContent=dateText(p);
      document.getElementById('viewerDescription').textContent=p.description||p.file||'';
      renderDetails(p);renderFilmstrip();
      const mobile=matchMedia('(max-width:640px)').matches;
      setDetailsExpanded(false);
      viewer.classList.toggle('details-hidden',mobile);document.querySelector('.viewer-panel').setAttribute('aria-hidden',String(mobile));
      viewer.classList.add('open'); document.body.classList.add('viewer-open'); document.getElementById(mobile?'mobileCloseViewer':'closeViewer').focus({preventScroll:true});
    }
    function close(){viewer.classList.remove('open');document.body.classList.remove('viewer-open');viewerImage.src='';viewerVideo.pause();viewerVideo.removeAttribute('src');stage.classList.remove('live-playing')}
    function zoom(next){scale=Math.max(1,Math.min(4,next));viewerImage.style.transform='scale('+scale+')'}
    function setDetailsExpanded(expanded){
      viewer.classList.toggle('details-expanded',expanded);
      const button=document.getElementById('mobileDetailsToggle');button.setAttribute('aria-expanded',String(expanded));button.innerHTML=expanded?'收起详细信息 <span aria-hidden="true">⌄</span>':'查看完整信息 <span aria-hidden="true">⌃</span>';
      document.querySelector('.viewer-panel').scrollTop=0;
      if(expanded&&viewerImage.complete)requestAnimationFrame(()=>renderHistogram(viewerImage));
    }

    function retryImage(img,manual=false){
      const frame=img.closest('.photo-frame'),attempt=manual?0:Number(img.dataset.retry||0);
      frame.classList.remove('failed','ready');img.classList.remove('loaded');img.dataset.retry=String(attempt+1);
      const original=img.dataset.original;
      img.src=attempt===0?original+'?retry='+Date.now():'https://raw.githubusercontent.com/tankey33/love/main/'+original+'?retry='+Date.now();
    }
    grid.addEventListener('click',e=>{const card=e.target.closest('.photo-card');if(!card)return;const failed=card.querySelector('.photo-frame.failed img');if(failed){retryImage(failed,true);return}openAt(+card.dataset.index)});
    grid.addEventListener('pointerover',e=>{const card=e.target.closest('.photo-card'),video=card?.querySelector('.tile-video');if(!video||card.contains(e.relatedTarget))return;card.classList.add('live-playing');video.currentTime=0;video.play().catch(()=>card.classList.remove('live-playing'))});
    grid.addEventListener('pointerout',e=>{const card=e.target.closest('.photo-card'),video=card?.querySelector('.tile-video');if(!video||card.contains(e.relatedTarget))return;video.pause();card.classList.remove('live-playing')});
    grid.addEventListener('error',e=>{
      if(e.target.tagName!=='IMG')return;
      const img=e.target,attempt=Number(img.dataset.retry||0);
      if(attempt<2){setTimeout(()=>retryImage(img),250*(attempt+1));return}
      img.closest('.photo-frame')?.classList.add('failed','ready');
    },true);
    grid.addEventListener('keydown',e=>{const card=e.target.closest('.photo-card');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openAt(+card.dataset.index)}});
    document.getElementById('closeViewer').addEventListener('click',close);
    document.getElementById('mobileCloseViewer').addEventListener('click',close);
    document.getElementById('mobileDetailsToggle').addEventListener('click',()=>setDetailsExpanded(!viewer.classList.contains('details-expanded')));
    document.getElementById('prevPhoto').addEventListener('click',()=>openAt(current-1));
    document.getElementById('nextPhoto').addEventListener('click',()=>openAt(current+1));
    document.getElementById('mobilePrevPhoto').addEventListener('click',e=>{e.stopPropagation();openAt(current-1)});
    document.getElementById('mobileNextPhoto').addEventListener('click',e=>{e.stopPropagation();openAt(current+1)});
    document.getElementById('viewerFilmstrip').addEventListener('click',e=>{const button=e.target.closest('[data-film-index]');if(button)openAt(Number(button.dataset.filmIndex))});
    stage.addEventListener('click',e=>{if(!matchMedia('(max-width:640px)').matches||e.target.closest('button')||scale>1||Date.now()<ignorePhotoClickUntil)return;const hidden=viewer.classList.toggle('details-hidden');document.querySelector('.viewer-panel').setAttribute('aria-hidden',String(hidden));if(hidden)setDetailsExpanded(false)});
    viewerImage.addEventListener('load',()=>renderHistogram(viewerImage));
    viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
    stage.addEventListener('wheel',e=>{e.preventDefault();zoom(scale+(e.deltaY<0?.3:-.3))},{passive:false});
    stage.addEventListener('dblclick',()=>zoom(scale>1?1:2));
    async function playLive(){if(!viewerVideo.src)return;stage.classList.add('live-playing');try{viewerVideo.currentTime=0;await viewerVideo.play()}catch(error){stage.classList.remove('live-playing')}}
    function stopLive(){if(!viewerVideo.src)return;viewerVideo.pause();stage.classList.remove('live-playing')}
    document.getElementById('viewerLiveBadge').addEventListener('click',e=>{e.stopPropagation();stage.classList.contains('live-playing')?stopLive():playLive()});
    stage.addEventListener('mouseenter',playLive);stage.addEventListener('mouseleave',stopLive);
    stage.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')playLive()});stage.addEventListener('pointerup',stopLive);stage.addEventListener('pointercancel',stopLive);
    stage.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});
    stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55&&scale===1){ignorePhotoClickUntil=Date.now()+400;openAt(current+(dx<0?1:-1))}},{passive:true});
    document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')openAt(current-1);if(e.key==='ArrowRight')openAt(current+1);if(e.key==='+'||e.key==='=')zoom(scale+.3);if(e.key==='-')zoom(scale-.3)});
    new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if(Math.abs(grid.clientWidth-lastGridWidth)>2)render()})}).observe(grid);
    render();
  })();
  </script>
</body>
</html>
