<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>我们的写真帖 · Tankey & Monody</title>
  <link rel="icon" href="./love.png">
  <style>
    :root{--paper:#f4f1ea;--card:#faf8f3;--ink:#242622;--muted:#74736d;--line:rgba(36,38,34,.14);--red:#ad5142;--green:#68705f;--shadow:0 20px 60px rgba(37,32,25,.1)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}body.viewer-open{overflow:hidden}
    a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{color:inherit}
    .topbar{position:sticky;top:0;z-index:40;background:rgba(244,241,234,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .topbar-inner{max-width:1500px;margin:auto;min-height:64px;padding:0 clamp(18px,4vw,58px);display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:10px;font-family:"Yu Mincho","Songti SC",serif;font-size:15px;letter-spacing:.08em}.brand-mark{width:9px;height:9px;border-radius:50%;background:var(--red)}
    .nav{display:flex;align-items:center;gap:20px;color:var(--muted);font-size:12px;letter-spacing:.08em}.nav a{padding:22px 0;border-bottom:1px solid transparent}.nav a:hover,.nav a.active{color:var(--ink);border-color:var(--red)}
    .intro{max-width:1500px;margin:auto;padding:clamp(52px,8vw,112px) clamp(18px,5vw,76px) clamp(38px,5vw,70px);display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:40px;align-items:end}
    .eyebrow{margin:0 0 18px;color:var(--red);font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}.intro h1{margin:0;max-width:900px;font-family:"Yu Mincho","Hiragino Mincho ProN","Songti SC",serif;font-weight:400;font-size:clamp(44px,7.4vw,108px);line-height:.98;letter-spacing:-.055em}.intro h1 em{font-family:Baskerville,Georgia,serif;font-weight:400;color:var(--green)}
    .intro-side{padding-left:24px;border-left:1px solid var(--line)}.intro-side p{margin:0;color:var(--muted);font-family:"Yu Mincho","Songti SC",serif;font-size:14px;line-height:2;letter-spacing:.08em}.stats{margin-top:28px;display:flex;gap:28px}.stat strong{display:block;font-family:Baskerville,Georgia,serif;font-size:28px;font-weight:400}.stat span{font-size:9px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
    .controls-wrap{position:sticky;top:64px;z-index:35;background:linear-gradient(var(--paper) 76%,rgba(244,241,234,0));padding:0 clamp(18px,4vw,58px) 18px}.controls{max-width:1500px;margin:auto;padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .filters,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.chip,.icon-btn,.sort{height:38px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:0 15px;cursor:pointer;font-size:11px;letter-spacing:.06em;transition:.2s}.chip:hover,.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.icon-btn{width:38px;padding:0;display:grid;place-items:center;font-size:15px}.icon-btn:hover{border-color:var(--ink)}.sort{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 12px) 16px;background-size:4px 4px;background-repeat:no-repeat}
    .gallery{max-width:1500px;margin:auto;padding:12px clamp(18px,4vw,58px) 100px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.4vw,22px)}.grid.compact{grid-template-columns:repeat(4,minmax(0,1fr))}
    .photo-card{min-width:0;cursor:zoom-in;contain:layout paint}.photo-frame{position:relative;overflow:hidden;background:#ddd7cd;aspect-ratio:var(--ratio,4/3)}.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .3s;filter:saturate(.84)}.photo-card:hover img{transform:scale(1.025);filter:saturate(1)}.photo-index{position:absolute;left:12px;top:12px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(250,248,243,.85);backdrop-filter:blur(8px);font-family:Baskerville,serif;font-size:11px}
    .photo-meta{padding:14px 2px 28px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line)}.photo-title{margin:0;font-family:"Yu Mincho","Songti SC",serif;font-size:15px;font-weight:400;letter-spacing:.05em}.photo-date{margin:5px 0 0;color:var(--muted);font-size:10px;letter-spacing:.08em}.photo-shape{color:var(--muted);font-size:9px;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
    .empty{display:none;padding:80px 0;text-align:center;color:var(--muted);font-family:"Yu Mincho","Songti SC",serif}.empty.show{display:block}
    .footer{border-top:1px solid var(--line);padding:28px clamp(18px,4vw,58px) 40px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:10px;letter-spacing:.1em}
    .viewer{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:minmax(0,1fr) 320px;background:rgba(20,21,19,.97);color:#f4f1ea;opacity:0;visibility:hidden;transition:opacity .25s}.viewer.open{opacity:1;visibility:visible}.stage{position:relative;min-width:0;overflow:hidden;display:grid;place-items:center;touch-action:none}.stage img{max-width:92%;max-height:90%;object-fit:contain;transform:translate3d(0,0,0) scale(1);transition:transform .22s ease;user-select:none;-webkit-user-drag:none}.viewer-panel{padding:28px 26px;border-left:1px solid rgba(255,255,255,.13);display:flex;flex-direction:column;background:#1f211e}.viewer-top{display:flex;justify-content:space-between;align-items:center}.viewer-count{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.55)}.viewer-close{border:1px solid rgba(255,255,255,.2);background:none;color:white;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:20px}.viewer-copy{margin:auto 0}.viewer-copy h2{margin:0 0 14px;font-family:"Yu Mincho","Songti SC",serif;font-size:30px;font-weight:400}.viewer-copy p{margin:0;color:rgba(255,255,255,.58);font-size:12px;line-height:1.8}.exif{margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.13);display:grid;grid-template-columns:1fr 1fr;gap:18px}.exif dt{color:rgba(255,255,255,.42);font-size:8px;letter-spacing:.13em;text-transform:uppercase}.exif dd{margin:5px 0 0;font-family:Baskerville,serif;font-size:13px}.viewer-nav{display:flex;gap:8px}.viewer-nav button{flex:1;height:44px;border:1px solid rgba(255,255,255,.2);background:transparent;color:white;cursor:pointer}.viewer-nav button:hover{background:white;color:#222}.zoom-hint{position:absolute;left:18px;bottom:16px;color:rgba(255,255,255,.45);font-size:9px;letter-spacing:.08em}
    @media(max-width:1050px){.grid,.grid.compact{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{grid-template-columns:1fr}.intro-side{max-width:560px}.viewer{grid-template-columns:1fr}.viewer-panel{position:absolute;left:0;right:0;bottom:0;padding:15px 16px;border:0;border-top:1px solid rgba(255,255,255,.13);background:linear-gradient(transparent,#161714 28%);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}.viewer-copy{padding-top:36px}.viewer-copy h2{font-size:20px;margin-bottom:5px}.viewer-copy p,.exif{display:none}.viewer-top{position:absolute;top:16px;right:16px}.viewer-count{display:none}.viewer-nav{width:130px}.stage img{max-height:75%}}
    @media(max-width:640px){.topbar-inner{min-height:56px;padding:0 15px}.nav{gap:13px}.nav a{padding:19px 0}.nav a:nth-child(4),.nav a:nth-child(5){display:none}.controls-wrap{top:56px;padding:0 12px 12px}.controls{overflow-x:auto;scrollbar-width:none}.actions .sort{display:none}.intro{padding:44px 18px 34px;gap:30px}.intro h1{font-size:clamp(42px,15vw,66px)}.intro-side{padding-left:16px}.stats{gap:22px}.gallery{padding:6px 10px 72px}.grid,.grid.compact{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo-meta{padding:10px 2px 18px}.photo-title{font-size:12px}.photo-shape{display:none}.photo-date{font-size:9px}.photo-index{left:8px;top:8px;width:25px;height:25px}.footer{padding:22px 16px 30px;flex-direction:column}.zoom-hint{display:none}}
    @media(max-width:390px){.brand{font-size:12px}.nav{gap:10px;font-size:11px}.intro h1{font-size:43px}.chip{padding:0 12px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.photo-frame img,.viewer,.stage img{transition:none!important}}
  </style>
<link rel="stylesheet" href="assets/css/japanese-theme.css">
</head>
<body class="site-page page-photo">
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="index.html"><span class="brand-mark"></span>Tankey × Monody</a>
    <nav class="nav" aria-label="主导航"><a href="index.html">首页</a><a class="active" href="photo.html">写真</a><a href="notes.html">手记</a><a href="movie.html">影像</a><a href="music.html">音乐</a></nav>
  </div></header>

  <section class="intro">
    <div><p class="eyebrow">Our photographic diary · since 2017</p><h1>一些关于<br><em>我们</em> 的瞬间。</h1></div>
    <div class="intro-side"><p>照片替我们记得光线、气味，和当时没有说出口的话。慢慢翻，时间会重新经过这里。</p><div class="stats"><div class="stat"><strong id="photoCount">0</strong><span>Frames</span></div><div class="stat"><strong id="yearCount">—</strong><span>Years</span></div></div></div>
  </section>

  <div class="controls-wrap"><div class="controls">
    <div class="filters" role="group" aria-label="照片筛选"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="landscape">横幅</button><button class="chip" data-filter="portrait">竖幅</button><button class="chip" data-filter="square">方形</button></div>
    <div class="actions"><select id="sort" class="sort" aria-label="照片排序"><option value="newest">最新优先</option><option value="oldest">最早优先</option><option value="title">按名称</option></select><button id="layoutToggle" class="icon-btn" aria-label="切换布局" title="切换布局">▦</button></div>
  </div></div>

  <main class="gallery"><div id="grid" class="grid"></div><div id="empty" class="empty">这一组暂时没有照片。</div></main>
  <footer class="footer"><span>© Tankey & Monody</span><span>光落下来，记忆就有了形状。</span></footer>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="照片查看器">
    <div id="stage" class="stage"><img id="viewerImage" alt=""><div class="zoom-hint">滚轮或双击缩放 · ESC 关闭</div></div>
    <aside class="viewer-panel"><div class="viewer-top"><span id="viewerCount" class="viewer-count"></span><button id="closeViewer" class="viewer-close" aria-label="关闭">×</button></div>
      <div class="viewer-copy"><h2 id="viewerTitle"></h2><p id="viewerDescription"></p><dl id="exif" class="exif"></dl></div>
      <div class="viewer-nav"><button id="prevPhoto" aria-label="上一张">←</button><button id="nextPhoto" aria-label="下一张">→</button></div>
    </aside>
  </div>

  <script src="assets/js/photo-data.js"></script>
  <script>
  (() => {
    const source = Array.isArray(window.PHOTO_DATA) ? window.PHOTO_DATA : [];
    const grid = document.getElementById('grid'), empty = document.getElementById('empty');
    const viewer = document.getElementById('viewer'), stage = document.getElementById('stage'), viewerImage = document.getElementById('viewerImage');
    let filter = 'all', items = [], current = 0, scale = 1, touchX = 0;

    const shape = p => { const r=(p.width||1)/(p.height||1); return r>1.12?'landscape':r<.88?'portrait':'square' };
    const dateOf = p => new Date((p.date || p.takenAt || p.mtime*1000) || Date.now());
    const dateText = p => new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(dateOf(p)).replaceAll('/','.');
    const safe = v => String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    const years = new Set(source.map(p=>dateOf(p).getFullYear()));
    document.getElementById('photoCount').textContent = source.length;
    document.getElementById('yearCount').textContent = years.size || '—';

    function render(){
      const order = document.getElementById('sort').value;
      items = source.filter(p => filter==='all' || shape(p)===filter).slice().sort((a,b)=>{
        if(order==='title') return String(a.title||a.file).localeCompare(String(b.title||b.file),'zh-CN',{numeric:true});
        return (dateOf(a)-dateOf(b))*(order==='oldest'?1:-1);
      });
      grid.innerHTML = items.map((p,i)=>{
        const title=safe(p.title||p.file||('照片 '+(i+1))), ratio=(p.width||4)+' / '+(p.height||3);
        return '<article class="photo-card" tabindex="0" role="button" aria-label="查看 '+title+'" data-index="'+i+'"><div class="photo-frame" style="--ratio:'+ratio+'"><img src="'+safe(p.thumb||p.full)+'" alt="'+title+'" loading="'+(i<4?'eager':'lazy')+'" decoding="async"><span class="photo-index">'+String(i+1).padStart(2,'0')+'</span></div><div class="photo-meta"><div><h2 class="photo-title">'+title+'</h2><p class="photo-date">'+dateText(p)+'</p></div><span class="photo-shape">'+shape(p)+'</span></div></article>';
      }).join('');
      empty.classList.toggle('show',!items.length);
    }

    function openAt(index){
      if(!items.length) return; current=(index+items.length)%items.length; const p=items[current]; scale=1;
      viewerImage.style.transform='scale(1)'; viewerImage.src=p.full; viewerImage.alt=p.title||p.file||'照片';
      document.getElementById('viewerTitle').textContent=p.title||p.file||'未命名照片';
      document.getElementById('viewerDescription').textContent=p.description||dateText(p);
      document.getElementById('viewerCount').textContent=String(current+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');
      const meta=[['日期',dateText(p)],['尺寸',(p.width||'—')+' × '+(p.height||'—')],['相机',p.camera||p.make],['镜头',p.lens],['光圈',p.aperture],['快门',p.shutter],['ISO',p.iso],['地点',p.location]];
      document.getElementById('exif').innerHTML=meta.filter(x=>x[1]).map(x=>'<div><dt>'+safe(x[0])+'</dt><dd>'+safe(x[1])+'</dd></div>').join('');
      viewer.classList.add('open'); document.body.classList.add('viewer-open'); document.getElementById('closeViewer').focus();
    }
    function close(){viewer.classList.remove('open');document.body.classList.remove('viewer-open');viewerImage.src=''}
    function zoom(next){scale=Math.max(1,Math.min(4,next));viewerImage.style.transform='scale('+scale+')'}

    grid.addEventListener('click',e=>{const card=e.target.closest('.photo-card');if(card)openAt(+card.dataset.index)});
    grid.addEventListener('keydown',e=>{const card=e.target.closest('.photo-card');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openAt(+card.dataset.index)}});
    document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');filter=btn.dataset.filter;render()}));
    document.getElementById('sort').addEventListener('change',render);
    document.getElementById('layoutToggle').addEventListener('click',()=>grid.classList.toggle('compact'));
    document.getElementById('closeViewer').addEventListener('click',close);
    document.getElementById('prevPhoto').addEventListener('click',()=>openAt(current-1));
    document.getElementById('nextPhoto').addEventListener('click',()=>openAt(current+1));
    viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
    stage.addEventListener('wheel',e=>{e.preventDefault();zoom(scale+(e.deltaY<0?.3:-.3))},{passive:false});
    stage.addEventListener('dblclick',()=>zoom(scale>1?1:2));
    stage.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});
    stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55&&scale===1)openAt(current+(dx<0?1:-1))},{passive:true});
    document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')openAt(current-1);if(e.key==='ArrowRight')openAt(current+1);if(e.key==='+'||e.key==='=')zoom(scale+.3);if(e.key==='-')zoom(scale-.3)});
    render();
  })();
  </script>
</body>
</html>
