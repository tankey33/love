<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>写真 · Tankey & Monody</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/photo.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/gallery.js" defer></script>
</head>
<body class="site-page page-photo">
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="index.html">TANKEY <span class="brand-heart">♥</span> MONODY <span class="brand-since">· SINCE 2017</span></a>
    <nav class="nav" aria-label="主导航"><a href="index.html">首页</a><a class="active" href="photo.html">写真</a><a href="notes.html">手记</a><a href="movie.html">影像</a><a href="music.html">音乐</a></nav>
  </div></header>
  <main id="main-content" class="gallery">
    <div class="gallery-heading"><h1>我们的写真帖</h1><p id="gallerySummary">正在整理我们的照片…</p></div>
    <div id="galleryMessage" class="gallery-message" role="status"><p id="galleryMessageText">照片加载中…</p><button id="retryGallery" class="retry-button" type="button" hidden>重新加载照片</button></div>
    <div id="grid" class="grid" aria-label="照片墙"></div>
    <div id="gallerySentinel" class="gallery-sentinel" aria-hidden="true"></div>
    <noscript><p class="error-state">请启用 JavaScript 浏览照片墙，或访问<a href="notes.html">手记</a>。</p></noscript>
  </main>
  <footer class="footer"><span>© Tankey & Monody</span><span>新的记忆大一些，旧日的光密一些。</span></footer>
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="照片查看器" hidden>
    <div class="viewer-toolbar"><button id="sharePhoto" class="viewer-control" type="button" aria-label="分享这张照片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg></button><button id="closeViewer" class="viewer-control" type="button" aria-label="关闭照片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="stage" class="stage">
      <img id="viewerPreview" class="viewer-preview" alt="" aria-hidden="true"><img id="viewerImage" alt="">
      <video id="viewerVideo" muted loop playsinline preload="none"></video>
      <button id="viewerLiveBadge" class="viewer-live-badge" type="button" hidden>◉ 实况</button>
      <div class="mobile-viewer-nav" aria-label="照片切换"><button id="mobilePrevPhoto" type="button" aria-label="上一张照片">‹</button><button id="mobileNextPhoto" type="button" aria-label="下一张照片">›</button></div>
      <div id="viewerFilmstrip" class="viewer-filmstrip" aria-label="照片缩略图"></div><p class="zoom-hint">拖动平移 · 滚轮或双指缩放 · ESC 关闭</p>
    </div>
    <aside class="viewer-panel" aria-hidden="false">
      <div class="viewer-summary"><p id="viewerKicker" class="viewer-kicker"></p><h2 id="viewerTitle" hidden></h2><p id="viewerDate" class="viewer-date"></p><button id="mobileDetailsToggle" class="mobile-details-toggle" type="button" aria-expanded="false" aria-controls="exif histogramSection viewerMap">查看完整信息 ⌃</button></div>
      <p id="viewerDescription" class="viewer-description" hidden></p>
      <div id="exif" class="viewer-details"></div>
      <details id="histogramSection" class="viewer-data-section"><summary>摄影直方图</summary><canvas id="viewerHistogram" aria-label="照片 RGB 直方图"></canvas><p id="histogramStatus"></p></details>
      <section id="viewerMap" class="viewer-data-section" hidden></section><div class="viewer-nav"><button id="prevPhoto" type="button">‹ 上一张</button><button id="nextPhoto" type="button">下一张 ›</button></div>
    </aside>
    <p id="viewerStatus" class="visually-hidden" role="status"></p>
  </div>
</body>
</html>
