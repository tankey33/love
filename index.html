<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf3f4">
  <meta name="description" content="Tankey 与 Monody 的日常收藏。把一起走过的时间、看过的风景，和舍不得忘的瞬间慢慢留下。">
  <title>Tankey ♥ Monody · 我们的日常</title>
  <link rel="icon" href="./love.png">
  <link rel="stylesheet" href="assets/css/tokens.css?v=20261019">
  <link rel="stylesheet" href="assets/css/base.css?v=20261019">
  <link rel="stylesheet" href="assets/css/home.css?v=20261019">
  <script src="assets/js/theme.js?v=20261019"></script>
  <script src="assets/js/home.js?v=20261019" defer></script>
</head>
<body class="site-page page-home">
  <a class="skip-link" href="#main">跳至主要内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="Tankey 与 Monody 首页">TANKEY <span class="brand-heart" aria-hidden="true">♥</span> MONODY <span class="brand-since">· SINCE 2017</span></a>
      <nav class="nav" aria-label="主导航">
        <a class="active" aria-current="page" href="index.html">首页</a>
        <a href="photo.html">写真</a>
        <a href="notes.html">手记</a>
        <a href="movie.html">影像</a>
        <a href="music.html">音乐</a>
      </nav>
    </div>
  </header>

  <main id="main" class="home-main">
    <section class="home-story" aria-labelledby="homeTitle">
      <div class="home-intro">
        <p class="home-eyebrow">我们的日常收藏</p>
        <h1 id="homeTitle" class="home-title">We fell<br>in love<span class="home-period">.</span></h1>
        <p class="home-description">把喜欢过的时间、看过的风景，<br class="desktop-break">和那些舍不得忘的瞬间，<br class="desktop-break">留在一个可以慢慢重看的地方。</p>
      </div>
      <figure class="home-portrait">
        <a class="portrait-link" href="photo.html" aria-label="进入我们的照片墙">
          <img src="./baby.png" width="960" height="960" alt="我们珍藏的日常照片" fetchpriority="high" decoding="async">
        </a>
        <figcaption><a href="photo.html">走进我们的日常 <span aria-hidden="true">↗</span></a></figcaption>
      </figure>
    </section>

    <section class="home-moments" aria-label="一起走过的时间与回忆">
      <div class="home-time">
        <div class="together-block">
          <h2 class="home-eyebrow">一起走过</h2>
          <p id="timeTogether" class="together-value">一起走过，仍在继续。</p>
          <p id="totalDays" class="home-subtle">始于 2017 年 12 月 29 日</p>
        </div>
        <div class="anniversary-block">
          <h2 id="anniversaryLabel" class="home-eyebrow">下一个周年纪念日</h2>
          <p id="anniversaryCountdown" class="anniversary-value">下一段四季，也一起走。</p>
          <p id="anniversaryDate" class="home-subtle">12 月 29 日</p>
        </div>
      </div>

      <a id="memoryLink" class="memory-card" href="photo.html" aria-labelledby="memoryHeading memoryTitle">
        <div class="memory-image-wrap">
          <img id="memoryImage" width="240" height="240" alt="" loading="lazy" decoding="async" hidden>
          <span id="memoryPlaceholder" class="memory-placeholder" aria-hidden="true">日々の記録</span>
        </div>
        <div class="memory-copy">
          <h2 id="memoryHeading" class="home-eyebrow">最近的记忆</h2>
          <p id="memoryTitle" class="memory-title">那些一起走过的日常。</p>
          <p id="memoryDate" class="home-subtle">在写真里，慢慢重看。</p>
          <span class="memory-action">重看这一刻 <span aria-hidden="true">↗</span></span>
        </div>
      </a>
    </section>
  </main>

  <footer class="home-footer">
    <p>© Tankey & Monody <span class="footer-note">光落下来，记忆就有了形状。</span><a class="home-timeline" href="timeline.html">时光年表 <span aria-hidden="true">↗</span></a></p>
    <div class="home-music" data-music-controls>
      <button id="musicToggle" class="music-btn" type="button" data-music-toggle aria-label="播放背景音乐" aria-pressed="false" title="单击播放或暂停背景音乐">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 18V6l11-2v12M9 9l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg>
      </button>
      <div class="music-copy"><span data-music-title>White</span><span data-music-status>轻点播放</span></div>
      <label class="music-volume"><span class="sr-only">背景音乐音量</span><input data-music-volume type="range" min="0" max="1" step="0.05" value="0.5" aria-label="背景音乐音量"></label>
    </div>
  </footer>
  <audio id="bgm" loop preload="none"><source src="./music/white.mp3" type="audio/mpeg"></audio>
</body>
</html>
