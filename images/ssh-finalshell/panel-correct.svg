<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720"><rect width="1100" height="720" rx="24" fill="#102b36"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="55" y="70" font-size="32" fill="white" font-weight="700">添加 SSH 公钥 · 正确填写示意</text><text x="55" y="112" font-size="20" fill="#aac9ce">本机已经生成密钥时，只需复制公钥并按服务商流程登记。</text><rect x="50" y="150" width="1000" height="405" rx="18" fill="#204550"/><text x="80" y="200" font-size="23" fill="white">名称：便于自己辨认的备注</text><rect x="80" y="220" width="940" height="60" rx="8" fill="#f3f8f8"/><text x="100" y="259" font-size="24" fill="#173541">MacBook-VPS</text><text x="80" y="330" font-size="23" fill="white">公钥：粘贴 .pub 文件的完整单行内容</text><rect x="80" y="350" width="940" height="100" rx="8" fill="#f3f8f8"/><text x="100" y="391" font-size="23" fill="#173541">ssh-ed25519 [这里是完整公钥数据] mac-vps</text><text x="100" y="426" font-size="18" fill="#875314">仅为格式示意，方括号内的占位文字不可直接使用</text><text x="80" y="507" font-size="22" fill="#8ed6cc">本机生成后，无需再点面板里的“生成密钥对”。</text><text x="55" y="606" font-size="24" fill="#ffc978">不要填：GitHub 网址 · 文件路径 · 私钥内容 · 指纹</text><text x="55" y="657" font-size="20" fill="#aac9ce">保存到面板后，仍需确认公钥已注入或绑定到目标 VPS 及账号。</text><text x="55" y="692" font-size="17" fill="#aac9ce">教学示意图，不代表特定服务商界面，也不表示已完成真实连接。</text></g></svg>
