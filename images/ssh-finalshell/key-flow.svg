<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="28" fill="#102b36"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="70" y="90" fill="#8ed6cc" font-size="20" letter-spacing="3">SSH · 密钥认证入门</text><text x="70" y="158" fill="white" font-size="42" font-weight="700">公钥给服务器，私钥留在自己电脑</text><rect x="70" y="215" width="440" height="250" rx="20" fill="#204550"/><rect x="690" y="215" width="440" height="250" rx="20" fill="#204550"/><text x="100" y="269" font-size="27" fill="white">你的 Mac / Windows</text><text x="100" y="323" font-size="23" fill="#ffc978">私钥：本机保管，用来签名</text><text x="100" y="365" font-size="22" fill="#d9e9ea">FinalShell 导入不带 .pub 的文件</text><text x="100" y="411" font-size="20" fill="#9cc2c6">密钥口令用于保护本地私钥</text><text x="720" y="269" font-size="27" fill="white">Linux VPS</text><text x="720" y="323" font-size="23" fill="#8ed6cc">公钥：登记到目标用户</text><text x="720" y="365" font-size="22" fill="#d9e9ea">~/.ssh/authorized_keys</text><text x="720" y="411" font-size="20" fill="#9cc2c6">验证签名，通过后允许登录</text><path d="M535 340H660m-18-12 18 12-18 12" fill="none" stroke="#8ed6cc" stroke-width="4"/><text x="552" y="310" font-size="20" fill="white">签名</text><text x="70" y="535" font-size="25" fill="white">公钥认证 ≠ 上传私钥</text><text x="70" y="580" font-size="21" fill="#b0cbd0">服务器保存公钥 · 客户端证明持有私钥 · 私钥不随登录发送给 VPS</text></g></svg>
