<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect width="1200" height="780" rx="28" fill="#102b36"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="60" y="76" font-size="38" fill="#ffffff" font-weight="700">同一个来源地址，可能有不同路径</text><text x="60" y="120" font-size="21" fill="#b5d2d7" font-weight="400">下图是排查示意，不是已证实的网络拓扑。</text><text x="60" y="190" font-size="26" fill="#8ed6cc" font-weight="700">A · 直连示意</text><rect x="60" y="220" width="290" height="115" rx="16" fill="#204550"/><text x="90" y="266" font-size="27" fill="#ffffff" font-weight="400">本地电脑</text><text x="90" y="304" font-size="21" fill="#c5dbdf" font-weight="400">实际网络出口</text><path d="M370 276H790m-12-9 12 9-12 9" fill="none" stroke="#8ed6cc" stroke-width="3"/><text x="460" y="258" font-size="22" fill="#ffffff" font-weight="400">SSH 连接</text><rect x="810" y="220" width="330" height="115" rx="16" fill="#204550"/><text x="840" y="266" font-size="26" fill="#ffffff" font-weight="400">目标 VPS · SSH</text><text x="840" y="304" font-size="20" fill="#c5dbdf" font-weight="400">记录看到的来源地址</text><text x="60" y="410" font-size="26" fill="#ffc978" font-weight="700">B · 同一 VPS 作为代理出口：待验证假设</text><rect x="60" y="450" width="280" height="115" rx="16" fill="#204550"/><text x="90" y="498" font-size="27" fill="#ffffff" font-weight="400">本地电脑</text><text x="90" y="536" font-size="21" fill="#c5dbdf" font-weight="400">代理 / TUN 分流</text><path d="M350 505H450m-12-9 12 9-12 9" fill="none" stroke="#8ed6cc" stroke-width="3"/><rect x="465" y="450" width="300" height="115" rx="16" fill="#204550"/><text x="495" y="498" font-size="24" fill="#ffffff" font-weight="400">VPS 上的代理出口</text><text x="495" y="536" font-size="20" fill="#c5dbdf" font-weight="400">向公网 SSH 地址回连</text><path d="M775 505H825m-12-9 12 9-12 9" fill="none" stroke="#8ed6cc" stroke-width="3"/><rect x="840" y="450" width="300" height="115" rx="16" fill="#204550"/><text x="865" y="498" font-size="24" fill="#ffffff" font-weight="400">同一 VPS · SSH</text><text x="865" y="536" font-size="20" fill="#c5dbdf" font-weight="400">可能看到自身公网 IP</text><text x="60" y="640" font-size="25" fill="#ffffff" font-weight="700">如何验证：SSH 配置 + 当前会话来源 + 同步对照测试</text><text x="60" y="689" font-size="22" fill="#c5dbdf" font-weight="400">自连接、NAT 或其他转发也可能改变来源，需结合日志与网络配置。</text><text x="60" y="735" font-size="23" fill="#ffc978" font-weight="400">HTTPS 出口查询结果，不能直接代表 SSH 的连接路径。</text></g></svg>