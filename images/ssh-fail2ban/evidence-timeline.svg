<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" rx="28" fill="#102b36"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="60" y="76" font-size="38" fill="#ffffff" font-weight="700">对齐时间线，区分事实与推测</text><text x="60" y="120" font-size="21" fill="#b5d2d7" font-weight="400">2026-10-22 · 按原稿日志时间整理，地址已替换为文档示例</text><path d="M90 182V638" stroke="#8ed6cc" stroke-width="4"/><circle cx="90" cy="185" r="9" fill="#8ed6cc"/><text x="125" y="192" font-size="21" fill="#8ed6cc" font-weight="400">17:50:54–56</text><text x="470" y="192" font-size="27" fill="#ffffff" font-weight="700">出现密码认证失败</text><text x="470" y="228" font-size="20" fill="#c5dbdf" font-weight="400">Failed password</text><circle cx="90" cy="290" r="9" fill="#8ed6cc"/><text x="125" y="297" font-size="21" fill="#8ed6cc" font-weight="400">17:51:19</text><text x="470" y="297" font-size="27" fill="#ffffff" font-weight="700">一次密码登录成功</text><text x="470" y="333" font-size="20" fill="#c5dbdf" font-weight="400">与当时本人维护记录相符</text><circle cx="90" cy="395" r="9" fill="#8ed6cc"/><text x="125" y="402" font-size="21" fill="#8ed6cc" font-weight="400">17:54:45–17:55:25</text><text x="470" y="402" font-size="27" fill="#ffffff" font-weight="700">再次出现多条密码失败</text><text x="470" y="438" font-size="20" fill="#c5dbdf" font-weight="400">不能仅凭摘录反推完整阈值</text><circle cx="90" cy="500" r="9" fill="#8ed6cc"/><text x="125" y="507" font-size="21" fill="#8ed6cc" font-weight="400">17:55:25</text><text x="470" y="507" font-size="27" fill="#ffffff" font-weight="700">Fail2ban 执行封禁</text><text x="470" y="543" font-size="20" fill="#c5dbdf" font-weight="400">Ban 203.0.113.10</text><circle cx="90" cy="605" r="9" fill="#8ed6cc"/><text x="125" y="612" font-size="21" fill="#8ed6cc" font-weight="400">随后，具体时间未记录</text><text x="470" y="612" font-size="27" fill="#ffffff" font-weight="700">控制台定向解封，SSH 恢复</text><text x="470" y="648" font-size="20" fill="#c5dbdf" font-weight="400">本次恢复结果</text><rect x="60" y="697" width="1080" height="65" rx="16" fill="#204550"/><text x="85" y="738" font-size="25" fill="#ffc978" font-weight="400">封禁与恢复有记录；来源为何像“自己”，仍需另行验证。</text></g></svg>