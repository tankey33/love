<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="28" fill="#102b36"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="60" y="76" font-size="38" fill="#ffffff" font-weight="700">SSH 连不上，先恢复再追因</text><text x="60" y="120" font-size="21" fill="#b5d2d7" font-weight="400">端口可达 ≠ 握手成功；一行报错不能独立证明 Fail2ban 封禁。</text><rect x="60" y="165" width="1080" height="98" rx="16" fill="#204550"/><text x="88" y="222" font-size="32" fill="#8ed6cc" font-weight="700">01</text><text x="175" y="204" font-size="27" fill="#ffffff" font-weight="700">保留管理入口</text><text x="175" y="240" font-size="22" fill="#c5dbdf" font-weight="400">进入服务商 VNC / 串口控制台</text><rect x="60" y="285" width="1080" height="98" rx="16" fill="#204550"/><text x="88" y="342" font-size="32" fill="#8ed6cc" font-weight="700">02</text><text x="175" y="324" font-size="27" fill="#ffffff" font-weight="700">检查服务与封禁</text><text x="175" y="360" font-size="22" fill="#c5dbdf" font-weight="400">SSH 监听 → jail 状态 → 来源 IP</text><rect x="60" y="405" width="1080" height="98" rx="16" fill="#204550"/><text x="88" y="462" font-size="32" fill="#8ed6cc" font-weight="700">03</text><text x="175" y="444" font-size="27" fill="#ffffff" font-weight="700">定向解封并重试</text><text x="175" y="480" font-size="22" fill="#c5dbdf" font-weight="400">只解除已核对的来源，另开新连接</text><rect x="60" y="525" width="1080" height="98" rx="16" fill="#204550"/><text x="88" y="582" font-size="32" fill="#8ed6cc" font-weight="700">04</text><text x="175" y="564" font-size="27" fill="#ffffff" font-weight="700">对齐日志，验证路径</text><text x="175" y="600" font-size="22" fill="#c5dbdf" font-weight="400">失败认证 → Ban → 解封结果</text><text x="60" y="700" font-size="25" fill="#ffc978" font-weight="400">未发现相关封禁？继续排查服务、限流、防火墙与代理。</text></g></svg>