<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410"><rect width="1100" height="410" rx="20" fill="#eff5f8"/><g font-family="Microsoft YaHei,sans-serif"><text x="45" y="65" fill="#17334b" font-size="30" font-weight="bold">先确定统计口径，再安排填报周期</text><rect x="45" y="95" width="1010" height="60" rx="10" fill="white" stroke="#bdd0dc"/><text x="70" y="134" font-size="24" fill="#167569">1. 统计年月｜选择年度与月份</text><rect x="45" y="170" width="1010" height="60" rx="10" fill="white" stroke="#bdd0dc"/><text x="70" y="209" font-size="24" fill="#167569">2. 月度工作天数｜确定标准工时</text><rect x="45" y="245" width="1010" height="60" rx="10" fill="white" stroke="#bdd0dc"/><text x="70" y="284" font-size="24" fill="#167569">3. 填报周期｜起止日期与所属统计月</text><text x="45" y="370" font-size="20" fill="#536879">周可以跨自然月，每个周期归入一个统计月。</text></g></svg>